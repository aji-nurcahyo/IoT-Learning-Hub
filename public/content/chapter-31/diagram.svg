<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .box-active { fill: #1e293b; stroke: #f43f5e; stroke-width: 2; rx: 8; }
      .box-sleep { fill: #1e293b; stroke: #10b981; stroke-width: 2; rx: 8; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .label { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; text-anchor: middle; }
      .label-mono { fill: #38bdf8; font-family: ui-monospace, monospace; font-size: 12px; text-anchor: middle; }
      .line { stroke: #64748b; stroke-width: 2; stroke-dasharray: 4 4; }
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .curve { stroke: #f43f5e; stroke-width: 3; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Header Title -->
  <text x="400" y="35" class="title">Arsitektur Power Domain &amp; Profil Duty Cycling Sensor</text>
  <text x="400" y="58" class="label">Siklus Transisi Active vs Deep Sleep Mode pada Mikrokontroler ESP32</text>

  <!-- Architecture Boxes -->
  <g transform="translate(40, 80)">
    <!-- Main Power Plane -->
    <rect x="0" y="0" width="340" height="150" class="box-active" />
    <text x="170" y="25" class="title" fill="#f43f5e">High-Power Main Domain</text>
    <text x="170" y="45" class="label" fill="#fda4af">(Dimatikan total saat Deep Sleep)</text>
    <rect x="20" y="60" width="140" height="35" rx="4" fill="#334155" />
    <text x="90" y="82" class="label-mono">Dual-Core 240MHz</text>
    <rect x="180" y="60" width="140" height="35" rx="4" fill="#334155" />
    <text x="250" y="82" class="label-mono">Wi-Fi / BT Modem</text>
    <rect x="20" y="105" width="300" height="30" rx="4" fill="#334155" />
    <text x="170" y="125" class="label-mono">Standard SRAM (520KB) &amp; High-Speed Bus</text>

    <!-- RTC Power Plane -->
    <rect x="380" y="0" width="340" height="150" class="box-sleep" />
    <text x="550" y="25" class="title" fill="#10b981">Always-On RTC Domain</text>
    <text x="550" y="45" class="label" fill="#6ee7b7">(Tetap beroperasi ~5-15 uA)</text>
    <rect x="400" y="60" width="140" height="35" rx="4" fill="#334155" />
    <text x="470" y="82" class="label-mono">RTC Timer (32kHz)</text>
    <rect x="560" y="60" width="140" height="35" rx="4" fill="#334155" />
    <text x="630" y="82" class="label-mono">ULP Co-processor</text>
    <rect x="400" y="105" width="300" height="30" rx="4" fill="#334155" />
    <text x="550" y="125" class="label-mono">RTC Slow/Fast Memory (16KB Retained)</text>
  </g>

  <!-- Power Waveform Timeline -->
  <g transform="translate(60, 260)">
    <text x="340" y="15" class="title">Grafik Profil Konsumsi Arus Dinamis (Duty Cycle)</text>
    
    <!-- Y Axis -->
    <line x1="40" y1="30" x2="40" y2="170" stroke="#94a3b8" stroke-width="2" />
    <text x="30" y="40" class="label" text-anchor="end">150mA</text>
    <text x="30" y="100" class="label" text-anchor="end">50mA</text>
    <text x="30" y="165" class="label" text-anchor="end">10uA</text>
    
    <!-- X Axis -->
    <line x1="40" y1="170" x2="650" y2="170" stroke="#94a3b8" stroke-width="2" />
    <text x="650" y="195" class="label">Waktu (s)</text>

    <!-- Waveform: Wake -> Read -> Connect -> Sleep -->
    <!-- Scale: Y=35 (150mA), Y=100 (50mA), Y=168 (10uA) -->
    <path d="M 40 168 L 70 168 L 70 110 L 110 110 L 110 40 L 160 40 L 160 168 L 600 168 L 600 110 L 630 110" class="curve" />

    <!-- Waveform Annotations -->
    <text x="90" y="95" class="label-mono" fill="#f43f5e">Sensor Read</text>
    <text x="135" y="28" class="label-mono" fill="#f43f5e">Wi-Fi Tx</text>
    <text x="380" y="155" class="label-mono" fill="#10b981">Deep Sleep (~10 uA)</text>

    <!-- Bracket for T_active -->
    <line x1="70" y1="180" x2="160" y2="180" stroke="#38bdf8" stroke-width="2" />
    <text x="115" y="195" class="label-mono">T_active (1.5s)</text>

    <!-- Bracket for T_sleep -->
    <line x1="160" y1="180" x2="600" y2="180" stroke="#10b981" stroke-width="2" />
    <text x="380" y="195" class="label-mono">T_sleep (598.5s)</text>
  </g>
</svg>
