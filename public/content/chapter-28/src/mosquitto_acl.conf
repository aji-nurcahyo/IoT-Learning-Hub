# Mosquitto MQTT Topic Access Control List (ACL)
# Chapter 28 — Internet of Things Learning Hub

# 1. Nonaktifkan Akses Anonim Secara Global
# allow_anonymous false

# 2. Aturan Hak Akses Pengguna Operator / Administrator
user operator_admin
topic readwrite #
topic readwrite $SYS/#

# 3. Aturan Isolasi Perangkat Lapangan (Pattern-Based Multi-Tenant Isolation)
# Pola %u mencocokkan Username terotentikasi, %c mencocokkan Client ID
# Hanya boleh mempublikasikan status, telemetri, dan respons konfigurasi miliknya sendiri
pattern write iot/fleet/%u/status
pattern write iot/fleet/%u/telemetry
pattern write iot/fleet/%u/event/+
pattern write iot/fleet/%u/config/reported

# Hanya boleh berlangganan ke perintah dan konfigurasi target miliknya sendiri
pattern read iot/fleet/%u/cmd/+
pattern read iot/fleet/%u/config/desired

# Larangan eksplisit: Perangkat dilarang membaca atau menulis ke topik milik perangkat lain
