<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-label="Rangkaian driver transistor low-side dengan flyback diode serta kurva kontrol threshold versus histeresis">
  <rect x="2" y="2" width="916" height="386" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">DRIVER AKTUATOR LOW-VOLTAGE DC, FLYBACK DIODE &amp; KONTROL HISTERESIS</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Melindungi GPIO dari overcurrent &amp; lonjakan induktif (L dI/dt), serta mencegah chattering aktuator</text>

  <!-- Left Panel: Low-side Driver + Flyback -->
  <rect x="24" y="74" width="430" height="292" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">1. Low-Side Driver + Flyback Diode (Beban 5 V DC)</text>

  <!-- +5V rail -->
  <line x1="250" y1="122" x2="360" y2="122" stroke="#b45309" stroke-width="2.2"/>
  <text x="305" y="115" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#92400e">+5V DC Eksternal</text>

  <!-- Inductive Load + Flyback Diode -->
  <line x1="280" y1="122" x2="280" y2="145" stroke="#1d2b27" stroke-width="1.8"/>
  <rect x="255" y="145" width="50" height="44" rx="5" fill="#eef4ef" stroke="#176e59" stroke-width="1.6"/>
  <text x="280" y="165" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#1d2b27">Motor /</text>
  <text x="280" y="179" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#1d2b27">Coil 5V</text>
  <line x1="280" y1="189" x2="280" y2="218" stroke="#1d2b27" stroke-width="1.8"/>

  <!-- Flyback Diode in parallel (reverse biased normally) -->
  <line x1="280" y1="134" x2="352" y2="134" stroke="#b45309" stroke-width="1.6"/>
  <line x1="352" y1="134" x2="352" y2="202" stroke="#b45309" stroke-width="1.6"/>
  <line x1="352" y1="202" x2="280" y2="202" stroke="#b45309" stroke-width="1.6"/>
  <polygon points="342,175 362,175 352,158" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <line x1="342" y1="158" x2="362" y2="158" stroke="#b45309" stroke-width="2"/>
  <text x="368" y="166" font-family="monospace" font-size="10" font-weight="700" fill="#92400e">1N5819 /</text>
  <text x="368" y="180" font-family="monospace" font-size="10" font-weight="700" fill="#92400e">1N4007</text>
  <text x="368" y="194" font-family="system-ui, sans-serif" font-size="9.5" fill="#78350f">(Flyback)</text>

  <!-- MOSFET / Transistor -->
  <rect x="242" y="218" width="76" height="44" rx="6" fill="#e7efe5" stroke="#176e59" stroke-width="1.6"/>
  <text x="280" y="238" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#176e59">N-MOSFET</text>
  <text x="280" y="253" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#3a4c45">(Logic-Level)</text>

  <!-- Gate Drive from GPIO -->
  <rect x="40" y="224" width="84" height="32" rx="5" fill="#e7efe5" stroke="#176e59" stroke-width="1.4"/>
  <text x="82" y="244" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#1d2b27">GPIO 25</text>
  <line x1="124" y1="240" x2="152" y2="240" stroke="#1d2b27" stroke-width="1.8"/>
  <rect x="152" y="231" width="44" height="18" rx="3" fill="#fff7ed" stroke="#b45309" stroke-width="1.4"/>
  <text x="174" y="244" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#92400e">220 Ω</text>
  <line x1="196" y1="240" x2="242" y2="240" stroke="#1d2b27" stroke-width="1.8"/>
  <!-- Pull-down 10k -->
  <line x1="218" y1="240" x2="218" y2="288" stroke="#62706a" stroke-width="1.4"/>
  <text x="194" y="280" font-family="monospace" font-size="9.5" fill="#4f6059">10kΩ</text>
  <line x1="218" y1="288" x2="280" y2="288" stroke="#1d2b27" stroke-width="1.8"/>

  <!-- GND -->
  <line x1="280" y1="262" x2="280" y2="306" stroke="#1d2b27" stroke-width="1.8"/>
  <line x1="264" y1="306" x2="296" y2="306" stroke="#1d2b27" stroke-width="2"/>
  <text x="280" y="322" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#1d2b27">COMMON GND</text>
  <text x="40" y="346" font-family="system-ui, sans-serif" font-size="10.5" fill="#4f6059">Pull-down 10 kΩ menjaga MOSFET tetap OFF saat MCU boot/reset (fail-safe).</text>

  <!-- Right Panel: Hysteresis Band -->
  <rect x="470" y="74" width="426" height="292" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
  <text x="486" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">2. Kontrol Histeresis (Anti-Chattering)</text>

  <!-- Axes -->
  <line x1="510" y1="240" x2="866" y2="240" stroke="#62706a" stroke-width="1.4"/>
  <line x1="510" y1="126" x2="510" y2="240" stroke="#62706a" stroke-width="1.4"/>
  <text x="486" y="156" font-family="monospace" font-size="10" fill="#991b1b">ON</text>
  <text x="486" y="236" font-family="monospace" font-size="10" fill="#176e59">OFF</text>

  <!-- Hysteresis loop -->
  <polyline points="520,230 695,230 695,148 845,148" fill="none" stroke="#b45309" stroke-width="2.5"/>
  <polyline points="845,148 615,148 615,230 520,230" fill="none" stroke="#176e59" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Threshold labels -->
  <line x1="615" y1="240" x2="615" y2="256" stroke="#176e59" stroke-width="1.4"/>
  <text x="615" y="268" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#176e59">T_LOW (28°C)</text>
  <line x1="695" y1="240" x2="695" y2="256" stroke="#b45309" stroke-width="1.4"/>
  <text x="695" y="268" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#b45309">T_HIGH (30°C)</text>
  <text x="655" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#78350f">Deadband</text>
  <text x="655" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#78350f">(2°C)</text>

  <text x="486" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">• Jika OFF &amp; T ≥ T_HIGH (30°C) → Kipas ON</text>
  <text x="486" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">• Jika ON &amp; T ≤ T_LOW (28°C) → Kipas OFF</text>
  <text x="486" y="336" font-family="system-ui, sans-serif" font-size="11" fill="#991b1b">• Jika sensor fault (NaN) → Fail-Safe OFF + Alarm!</text>
</svg>

