<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-label="Arsitektur dan pemetaan pin Capstone Smart Environmental Monitoring and Local Control System pada ESP32-DevKitC V4">
  <rect x="2" y="2" width="916" height="416" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">CAPSTONE LEVEL 1: SMART ENVIRONMENTAL MONITORING &amp; LOCAL CONTROL</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Integrasi ESP32-DevKitC V4 (Low-Voltage DC 3,3 V / 5 V, Non-Blocking FSM, Kalibrasi, Histeresis &amp; Fail-Safe — Tanpa Cloud)</text>

  <!-- Left: Inputs -->
  <rect x="24" y="76" width="248" height="92" rx="9" fill="#eef4ef" stroke="#176e59" stroke-width="1.6"/>
  <text x="38" y="98" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1d2b27">Input Analog: Sensor Suhu</text>
  <text x="38" y="116" font-family="monospace" font-size="11" fill="#176e59">NTC 10k / Divider -&gt; GPIO 34</text>
  <text x="38" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#3a4c45">ADC1_CH6 + Moving Avg (N=8)</text>
  <text x="38" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#3a4c45">+ Kalibrasi 2-titik + Cek NaN</text>

  <rect x="24" y="182" width="248" height="84" rx="9" fill="#eef4ef" stroke="#176e59" stroke-width="1.6"/>
  <text x="38" y="204" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1d2b27">Input Digital 1: Tombol Mode</text>
  <text x="38" y="222" font-family="monospace" font-size="11" fill="#176e59">Push Button &lt;-&gt; GPIO 27 &amp; GND</text>
  <text x="38" y="240" font-family="system-ui, sans-serif" font-size="11" fill="#3a4c45">INPUT_PULLUP + Debounce 50 ms</text>
  <text x="38" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#3a4c45">Mode: NORMAL / STRICT / MANUAL</text>

  <rect x="24" y="280" width="248" height="84" rx="9" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
  <text x="38" y="302" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">Input Digital 2: Interlock</text>
  <text x="38" y="320" font-family="monospace" font-size="11" fill="#92400e">Safety Switch &lt;-&gt; GPIO 14 &amp; GND</text>
  <text x="38" y="338" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">LOW = Aman | HIGH = Terbuka</text>
  <text x="38" y="353" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">Memicu FAIL_SAFE seketika</text>

  <!-- Center: ESP32 Core -->
  <rect x="332" y="112" width="256" height="218" rx="14" fill="#ffffff" stroke="#176e59" stroke-width="2.2"/>
  <text x="460" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#176e59">ESP32-DevKitC V4</text>
  <text x="460" y="158" text-anchor="middle" font-family="monospace" font-size="11" fill="#4f6059">(WROOM-32 · 3,3 V Logic)</text>
  <line x1="352" y1="170" x2="568" y2="170" stroke="#dce3dc" stroke-width="1.4"/>
  <text x="352" y="192" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1d2b27">Firmware Non-Blocking (millis):</text>
  <text x="352" y="212" font-family="monospace" font-size="10.5" fill="#1d2b27">1. Cek Interlock &amp; Fault (50 ms)</text>
  <text x="352" y="229" font-family="monospace" font-size="10.5" fill="#1d2b27">2. Akuisisi ADC1 + Kalibrasi</text>
  <text x="352" y="246" font-family="monospace" font-size="10.5" fill="#1d2b27">3. Debounce Tombol Mode</text>
  <text x="352" y="263" font-family="monospace" font-size="10.5" fill="#1d2b27">4. Kontrol Histeresis FSM</text>
  <text x="352" y="280" font-family="monospace" font-size="10.5" fill="#1d2b27">5. Telemetry Serial JSON (1000 ms)</text>
  <rect x="352" y="294" width="216" height="24" rx="5" fill="#e7efe5"/>
  <text x="460" y="310" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#176e59">UART0 (115200 baud) -&gt; PC Log</text>

  <!-- Right: Actuators -->
  <rect x="648" y="76" width="248" height="92" rx="9" fill="#e7efe5" stroke="#176e59" stroke-width="1.6"/>
  <text x="662" y="98" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1d2b27">Output 1: Driver Kipas PWM</text>
  <text x="662" y="116" font-family="monospace" font-size="11" fill="#176e59">GPIO 25 -&gt; 220Ω -&gt; MOSFET/LED</text>
  <text x="662" y="134" font-family="system-ui, sans-serif" font-size="11" fill="#3a4c45">Pull-down 10kΩ + Flyback Diode</text>
  <text x="662" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#3a4c45">LEDC 5 kHz, 8-bit (0..255)</text>

  <rect x="648" y="182" width="248" height="84" rx="9" fill="#eef4ef" stroke="#176e59" stroke-width="1.6"/>
  <text x="662" y="204" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1d2b27">Output 2: LED Status Sistem</text>
  <text x="662" y="222" font-family="monospace" font-size="11" fill="#176e59">GPIO 26 -&gt; 220Ω -&gt; LED -&gt; GND</text>
  <text x="662" y="240" font-family="system-ui, sans-serif" font-size="11" fill="#3a4c45">Kedip 1 s (OK), Cepat (STRICT),</text>
  <text x="662" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#3a4c45">Solid (MANUAL) / Mati (FAULT)</text>

  <rect x="648" y="280" width="248" height="84" rx="9" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="662" y="302" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">Output 3: Buzzer Alarm</text>
  <text x="662" y="320" font-family="monospace" font-size="11" fill="#991b1b">GPIO 18 -&gt; Active Buzzer 3.3V</text>
  <text x="662" y="338" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">ON saat FAULT_SAFE atau</text>
  <text x="662" y="353" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">over-temperature darurat</text>

  <!-- Arrows -->
  <defs>
    <marker id="cap-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#176e59"/>
    </marker>
    <marker id="cap-amb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>
  <line x1="272" y1="122" x2="328" y2="175" stroke="#176e59" stroke-width="2" marker-end="url(#cap-arr)"/>
  <line x1="272" y1="224" x2="328" y2="224" stroke="#176e59" stroke-width="2" marker-end="url(#cap-arr)"/>
  <line x1="272" y1="322" x2="328" y2="270" stroke="#b45309" stroke-width="2" marker-end="url(#cap-amb)"/>

  <line x1="588" y1="175" x2="644" y2="122" stroke="#176e59" stroke-width="2" marker-end="url(#cap-arr)"/>
  <line x1="588" y1="224" x2="644" y2="224" stroke="#176e59" stroke-width="2" marker-end="url(#cap-arr)"/>
  <line x1="588" y1="270" x2="644" y2="322" stroke="#b45309" stroke-width="2" marker-end="url(#cap-amb)"/>

  <text x="24" y="396" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4f6059">Seluruh rangkaian wajib berbagi Common GND; catu kipas DC 5 V memakai suplai eksternal melalui MOSFET driver (bukan pin 3V3 MCU).</text>
</svg>

