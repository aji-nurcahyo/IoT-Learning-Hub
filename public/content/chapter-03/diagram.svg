<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" aria-label="Skema rangkaian resistor pembatas arus LED, konfigurasi pull-up versus pull-down, dan cara aman menyambung multimeter">
  <rect x="2" y="2" width="916" height="376" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">ELEKTRONIKA DASAR, PULL-UP/DOWN &amp; KESELAMATAN PENGUKURAN DC</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Seluruh rangkaian dibatasi pada tegangan rendah DC (3,3 V / 5 V) dengan referensi Ground (GND) bersama</text>

  <!-- Panel 1: LED Current Limiting -->
  <rect x="24" y="74" width="276" height="278" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">1. Resistor Pembatas Arus LED</text>
  <text x="40" y="116" font-family="monospace" font-size="11" fill="#176e59">GPIO (3.3 V) --[ R ]--&gt;|-- GND</text>
  <!-- Draw schematic -->
  <rect x="48" y="142" width="66" height="34" rx="5" fill="#e7efe5" stroke="#176e59" stroke-width="1.4"/>
  <text x="81" y="163" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#1d2b27">GPIO 3.3V</text>
  <line x1="114" y1="159" x2="144" y2="159" stroke="#1d2b27" stroke-width="2"/>
  <!-- Resistor box -->
  <rect x="144" y="149" width="54" height="20" rx="3" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
  <text x="171" y="163" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#92400e">220 Ω</text>
  <line x1="198" y1="159" x2="224" y2="159" stroke="#1d2b27" stroke-width="2"/>
  <!-- LED triangle -->
  <polygon points="224,147 224,171 244,159" fill="#fef3c7" stroke="#b45309" stroke-width="1.6"/>
  <line x1="244" y1="147" x2="244" y2="171" stroke="#b45309" stroke-width="2"/>
  <line x1="244" y1="159" x2="266" y2="159" stroke="#1d2b27" stroke-width="2"/>
  <line x1="266" y1="159" x2="266" y2="195" stroke="#1d2b27" stroke-width="2"/>
  <line x1="254" y1="195" x2="278" y2="195" stroke="#1d2b27" stroke-width="2"/>
  <line x1="259" y1="200" x2="273" y2="200" stroke="#1d2b27" stroke-width="1.8"/>
  <text x="266" y="216" text-anchor="middle" font-family="monospace" font-size="10" fill="#4f6059">GND</text>
  <text x="40" y="252" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">Jika V_CC = 3,3 V, V_F = 2,0 V:</text>
  <text x="40" y="272" font-family="monospace" font-size="11" fill="#176e59">I = (3.3 - 2.0) / 220 = 5.91 mA</text>
  <text x="40" y="294" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">Tanpa R: arus melonjak &gt; batas GPIO</text>
  <text x="40" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">dan dapat merusak pin MCU!</text>

  <!-- Panel 2: Pull-Up vs Pull-Down -->
  <rect x="322" y="74" width="276" height="278" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="338" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">2. Pull-Up Resistor (Anti-Floating)</text>
  <text x="338" y="116" font-family="monospace" font-size="11" fill="#176e59">IDLE = HIGH (3.3V) | TEKAN = LOW</text>
  <!-- 3.3V rail -->
  <line x1="395" y1="138" x2="445" y2="138" stroke="#176e59" stroke-width="2.5"/>
  <text x="420" y="132" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#176e59">+3.3V</text>
  <line x1="420" y1="138" x2="420" y2="152" stroke="#1d2b27" stroke-width="1.8"/>
  <rect x="398" y="152" width="44" height="24" rx="3" fill="#eef4ef" stroke="#176e59" stroke-width="1.5"/>
  <text x="420" y="168" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#176e59">10 kΩ</text>
  <line x1="420" y1="176" x2="420" y2="202" stroke="#1d2b27" stroke-width="1.8"/>
  <circle cx="420" cy="195" r="3.5" fill="#176e59"/>
  <line x1="420" y1="195" x2="478" y2="195" stroke="#176e59" stroke-width="2"/>
  <rect x="478" y="182" width="90" height="26" rx="4" fill="#e7efe5" stroke="#176e59" stroke-width="1.4"/>
  <text x="523" y="199" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="700" fill="#1d2b27">GPIO IN</text>
  <!-- Switch -->
  <line x1="420" y1="202" x2="420" y2="215" stroke="#1d2b27" stroke-width="1.8"/>
  <circle cx="420" cy="215" r="3" fill="#1d2b27"/>
  <line x1="420" y1="215" x2="438" y2="233" stroke="#b45309" stroke-width="2"/>
  <circle cx="420" cy="240" r="3" fill="#1d2b27"/>
  <text x="448" y="232" font-family="monospace" font-size="10" fill="#92400e">Switch</text>
  <line x1="420" y1="240" x2="420" y2="258" stroke="#1d2b27" stroke-width="1.8"/>
  <line x1="406" y1="258" x2="434" y2="258" stroke="#1d2b27" stroke-width="2"/>
  <text x="420" y="274" text-anchor="middle" font-family="monospace" font-size="10" fill="#4f6059">GND</text>
  <text x="338" y="298" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">Saat switch terbuka: pin ditarik ke 3,3 V</text>
  <text x="338" y="314" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">melalui 10 kΩ (tidak mengambang/floating).</text>
  <text x="338" y="330" font-family="system-ui, sans-serif" font-size="11" fill="#176e59">Saat ditekan: arus 0,33 mA ke GND.</text>

  <!-- Panel 3: Multimeter Safety -->
  <rect x="620" y="74" width="276" height="278" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <text x="636" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">3. Cara Aman Mengukur Multimeter</text>
  <text x="636" y="126" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#176e59">Tegangan (Voltmeter) = PARALEL</text>
  <text x="636" y="144" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">Probe merah ke titik uji, hitam ke GND.</text>
  <text x="636" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">Impedansi tinggi, tidak memutus jalur.</text>

  <text x="636" y="194" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#b45309">Arus (Ammeter) = SERI</text>
  <text x="636" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">Putus satu jalur beban, sisipkan meter.</text>
  <text x="636" y="228" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">JANGAN ukur paralel ke +VCC &amp; GND</text>
  <text x="636" y="244" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">pada mode A/mA (short circuit / sekering putus!).</text>

  <text x="636" y="278" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1d2b27">Resistansi (Ohmmeter) = DAYA MATI</text>
  <text x="636" y="296" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">Selalu matikan power supply &amp; cabut</text>
  <text x="636" y="312" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">komponen sebelum ukur Ω / kontinuitas.</text>
</svg>

