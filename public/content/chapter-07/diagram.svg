<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-label="Diagram konsep sampling ADC, kuantisasi, aliasing Nyquist, dan modulasi PWM duty cycle">
  <rect x="2" y="2" width="916" height="386" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">SINYAL ANALOG, KUANTISASI ADC, NYQUIST ALIASING &amp; PWM</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Pada ESP32 klasik, gunakan kanal ADC1 (GPIO 32–39) agar tidak bentrok dengan Wi-Fi (ADC2)</text>

  <!-- Panel 1: ADC Sampling & Quantization -->
  <rect x="24" y="74" width="428" height="148" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">1. Sampling &amp; Kuantisasi ADC (12-bit: 0..4095)</text>
  <line x1="48" y1="196" x2="424" y2="196" stroke="#62706a" stroke-width="1.2"/>
  <line x1="48" y1="112" x2="48" y2="196" stroke="#62706a" stroke-width="1.2"/>
  <!-- Analog curve -->
  <path d="M 48 182 Q 130 112 220 144 T 412 126" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- Quantized steps -->
  <polyline points="48,182 95,182 95,148 142,148 142,135 189,135 189,144 236,144 236,156 283,156 283,150 330,150 330,138 377,138 377,126 412,126"
            fill="none" stroke="#176e59" stroke-width="2.2"/>
  <circle cx="95" cy="148" r="3.5" fill="#b45309"/>
  <circle cx="142" cy="135" r="3.5" fill="#b45309"/>
  <circle cx="189" cy="144" r="3.5" fill="#b45309"/>
  <circle cx="236" cy="156" r="3.5" fill="#b45309"/>
  <circle cx="283" cy="150" r="3.5" fill="#b45309"/>
  <circle cx="330" cy="138" r="3.5" fill="#b45309"/>
  <circle cx="377" cy="126" r="3.5" fill="#b45309"/>
  <text x="56" y="212" font-family="monospace" font-size="10.5" fill="#176e59">ΔV (1 LSB) = V_FS / (2^N - 1) | Error kuantisasi ≤ ±0.5 LSB</text>

  <!-- Panel 2: Nyquist vs Aliasing -->
  <rect x="468" y="74" width="428" height="148" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
  <text x="484" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">2. Kriteria Nyquist (f_s &gt; 2 f_max) vs Aliasing</text>
  <text x="484" y="122" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">• Sinyal asli: f_sig = 60 Hz</text>
  <text x="484" y="142" font-family="system-ui, sans-serif" font-size="11.5" fill="#176e59">• Jika f_s = 200 Hz (&gt; 120 Hz): bentuk sinyal terekonstruksi.</text>
  <text x="484" y="162" font-family="system-ui, sans-serif" font-size="11.5" fill="#991b1b">• Jika f_s = 80 Hz (&lt; 120 Hz): ALIASING muncul pada</text>
  <text x="484" y="182" font-family="monospace" font-size="11.5" font-weight="700" fill="#991b1b">  f_alias = |f_sig - f_s| = |60 - 80| = 20 Hz!</text>
  <text x="484" y="206" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">Praktik baik: pilih f_s minimal 5x–10x f_max + filter anti-aliasing.</text>

  <!-- Panel 3: PWM Duty Cycle -->
  <rect x="24" y="238" width="872" height="130" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="262" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">3. Pulse Width Modulation (PWM): Mengatur Tegangan Efektif via Duty Cycle</text>

  <!-- 25% Duty -->
  <text x="40" y="294" font-family="monospace" font-size="11" font-weight="700" fill="#176e59">Duty = 25% (V_avg ≈ 0.825 V)</text>
  <polyline points="40,342 40,308 85,308 85,342 220,342 220,308 265,308 265,342 400,342" fill="none" stroke="#176e59" stroke-width="2.2"/>

  <!-- 75% Duty -->
  <text x="468" y="294" font-family="monospace" font-size="11" font-weight="700" fill="#b45309">Duty = 75% (V_avg ≈ 2.475 V)</text>
  <polyline points="468,342 468,308 603,308 603,342 648,342 648,308 783,308 783,342 828,342" fill="none" stroke="#b45309" stroke-width="2.2"/>

  <text x="40" y="360" font-family="monospace" font-size="10.5" fill="#4f6059">V_avg = D * V_HIGH | Pada LEDC 10-bit (0..1023) @ 5 kHz, D = value / 1023</text>
</svg>

