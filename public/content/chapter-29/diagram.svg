<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .box-part { fill: #161e2e; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .box-active { fill: #102a24; stroke: #10b981; stroke-width: 2; rx: 8; }
      .box-target { fill: #2e1d35; stroke: #a855f7; stroke-width: 2; rx: 8; }
      .box-rollback { fill: #33151b; stroke: #ef4444; stroke-width: 2; rx: 8; }
      .subbox { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 6; }
      .title { font-family: 'DM Sans', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .label { font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #f1f5f9; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38bdf8; }
      .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arr); }
      .arrow-red { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 4,4; marker-end: url(#arr-red); }
      .arrow-green { stroke: #10b981; stroke-width: 2; marker-end: url(#arr-green); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" />

  <text x="40" y="45" class="title">Dual-Bank A/B OTA Architecture &amp; Automatic Rollback Engine</text>
  <text x="40" y="68" class="subtitle">Arsitektur Pembaruan Firmware Jarak Jauh: Verifikasi Tanda Tangan Kriptografis, Health-Check, dan Anti-Bricking</text>

  <!-- Section 1: Flash Partition Table Layout -->
  <g transform="translate(40, 105)">
    <rect width="250" height="395" class="box-part" />
    <text x="20" y="32" class="label" fill="#60a5fa">Flash Memory Layout (A/B)</text>
    <text x="20" y="52" class="subtitle">Peta Partisi Flash 4MB / 8MB</text>

    <!-- Bootloader & otadata -->
    <rect x="20" y="70" width="210" height="60" class="subbox" />
    <text x="30" y="92" class="label" font-size="12">Bootloader &amp; otadata</text>
    <text x="30" y="112" class="mono" fill="#94a3b8">Index: Active Boot Target</text>

    <!-- Bank app0 -->
    <rect x="20" y="140" width="210" height="85" class="subbox" fill="#132a24" stroke="#10b981" />
    <text x="30" y="162" class="label" font-size="12" fill="#86efac">Bank 0: app0 (Aktif)</text>
    <text x="30" y="182" class="mono">Version: v1.0.0 (Stable)</text>
    <text x="30" y="200" class="mono" fill="#34d399">State: VALID (Running)</text>

    <!-- Bank app1 -->
    <rect x="20" y="235" width="210" height="85" class="subbox" fill="#2d1533" stroke="#a855f7" />
    <text x="30" y="257" class="label" font-size="12" fill="#d8b4fe">Bank 1: app1 (Target OTA)</text>
    <text x="30" y="277" class="mono">Version: v1.1.0-new</text>
    <text x="30" y="295" class="mono" fill="#fbbf24">State: PENDING_VERIFY</text>

    <!-- NVS -->
    <rect x="20" y="330" width="210" height="50" class="subbox" />
    <text x="30" y="352" class="label" font-size="12">NVS / Storage</text>
    <text x="30" y="368" class="mono" fill="#94a3b8">WiFi, Certs, Config</text>
  </g>

  <!-- Section 2: Verification & Flashing Pipeline -->
  <g transform="translate(330, 105)">
    <rect width="280" height="395" class="box-target" />
    <text x="20" y="32" class="label" fill="#c084fc">OTA Ingestion &amp; Verification</text>
    <text x="20" y="52" class="subtitle">Validasi Kriptografis Sebelum Tulis</text>

    <!-- Package Ingest -->
    <rect x="20" y="75" width="240" height="85" class="subbox" />
    <text x="30" y="98" class="label" font-size="12">1. Image Download</text>
    <text x="30" y="118" class="mono">HTTP GET / MQTT Chunking</text>
    <text x="30" y="136" class="mono" fill="#94a3b8">Stream langsung ke flash bank pasif</text>

    <!-- Cryptographic Verification -->
    <rect x="20" y="170" width="240" height="95" class="subbox" />
    <text x="30" y="193" class="label" font-size="12" fill="#c084fc">2. Signature Check</text>
    <text x="30" y="213" class="mono">• SHA-256 Digest Match</text>
    <text x="30" y="231" class="mono">• ECDSA / RSA Signature</text>
    <text x="30" y="249" class="mono" fill="#34d399">Tolak jika binary corrupt/tampered</text>

    <!-- Switch Boot Index -->
    <rect x="20" y="275" width="240" height="95" class="subbox" />
    <text x="30" y="298" class="label" font-size="12" fill="#fbbf24">3. Switch Boot Pointer</text>
    <text x="30" y="318" class="mono">otadata -> Pointer ke app1</text>
    <text x="30" y="336" class="mono">State: PENDING_VERIFY</text>
    <text x="30" y="354" class="mono" fill="#38bdf8">Reboot mikrokontroler</text>
  </g>

  <!-- Section 3: Health-Check & Automatic Rollback -->
  <g transform="translate(650, 105)">
    <rect width="270" height="395" class="box-rollback" />
    <text x="20" y="32" class="label" fill="#f87171">Health-Check &amp; Anti-Bricking</text>
    <text x="20" y="52" class="subtitle">Proteksi Kegagalan Runtime</text>

    <!-- Health Check Criteria -->
    <rect x="20" y="75" width="230" height="95" class="subbox" />
    <text x="30" y="98" class="label" font-size="12" fill="#86efac">Runtime Verification</text>
    <text x="30" y="118" class="mono">1. Boot normal tanpa panic</text>
    <text x="30" y="136" class="mono">2. Koneksi WiFi &amp; MQTT stabil</text>
    <text x="30" y="154" class="mono">3. Sensor terdeteksi valid</text>

    <!-- Branch A: Confirm Success -->
    <rect x="20" y="180" width="230" height="85" class="subbox" fill="#102a24" stroke="#10b981" />
    <text x="30" y="202" class="label" font-size="12" fill="#86efac">Sukses: Mark As Valid</text>
    <text x="30" y="222" class="mono">esp_ota_mark_app_valid_cancel_rollback()</text>
    <text x="30" y="240" class="mono" fill="#34d399">Firmware resmi permanen!</text>

    <!-- Branch B: Rollback -->
    <rect x="20" y="275" width="230" height="100" class="subbox" fill="#2d1519" stroke="#ef4444" />
    <text x="30" y="298" class="label" font-size="12" fill="#fca5a5">Gagal: Automatic Rollback</text>
    <text x="30" y="318" class="mono">Crash / Watchdog Timeout!</text>
    <text x="30" y="336" class="mono">Bootloader kembali ke app0</text>
    <text x="30" y="354" class="mono" fill="#f87171">Nol risiko perangkat bricked</text>
  </g>

  <!-- Connectors -->
  <line x1="290" y1="210" x2="330" y2="210" class="arrow" />
  <line x1="610" y1="210" x2="650" y2="210" class="arrow" />
</svg>
