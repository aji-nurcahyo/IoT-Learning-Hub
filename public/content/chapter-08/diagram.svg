<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-label="Perbedaan akurasi dan presisi, kurva kalibrasi dua titik, serta waktu respons sensor orde satu">
  <rect x="2" y="2" width="916" height="386" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">AKURASI VS PRESISI, KALIBRASI DUA TITIK &amp; RESPONSE TIME SENSOR</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Kalibrasi menghilangkan systematic error (bias &amp; gain), sedangkan averaging menekan random error (noise)</text>

  <!-- Panel 1: Accuracy vs Precision -->
  <rect x="24" y="74" width="280" height="292" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">1. Akurasi vs Presisi</text>

  <!-- Target A: Precise but Biased -->
  <circle cx="92" cy="162" r="40" fill="none" stroke="#c8d4cc" stroke-width="1.4"/>
  <circle cx="92" cy="162" r="22" fill="none" stroke="#c8d4cc" stroke-width="1.4"/>
  <circle cx="92" cy="162" r="4" fill="#176e59"/>
  <circle cx="116" cy="138" r="3" fill="#b45309"/>
  <circle cx="121" cy="142" r="3" fill="#b45309"/>
  <circle cx="118" cy="146" r="3" fill="#b45309"/>
  <circle cx="113" cy="142" r="3" fill="#b45309"/>
  <text x="92" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">Presisi Tinggi,</text>
  <text x="92" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#92400e">Akurasi Rendah</text>
  <text x="92" y="247" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#4f6059">(Systematic Bias)</text>

  <!-- Target B: Accurate & Precise -->
  <circle cx="232" cy="162" r="40" fill="none" stroke="#c8d4cc" stroke-width="1.4"/>
  <circle cx="232" cy="162" r="22" fill="none" stroke="#c8d4cc" stroke-width="1.4"/>
  <circle cx="232" cy="162" r="4" fill="#176e59"/>
  <circle cx="230" cy="160" r="3" fill="#176e59"/>
  <circle cx="235" cy="164" r="3" fill="#176e59"/>
  <circle cx="234" cy="159" r="3" fill="#176e59"/>
  <circle cx="229" cy="165" r="3" fill="#176e59"/>
  <text x="232" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#176e59">Akurat &amp; Presisi</text>
  <text x="232" y="232" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#176e59">(Setelah Kalibrasi)</text>
  <text x="232" y="247" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#4f6059">(Residual Acak Kecil)</text>

  <text x="40" y="286" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">• Systematic Error: diatasi kalibrasi</text>
  <text x="40" y="304" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">• Random Error: diukur via std dev (s)</text>
  <text x="40" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">• Gabungan: u_c = sqrt(u_A² + u_B²)</text>

  <!-- Panel 2: Two-Point Calibration -->
  <rect x="320" y="74" width="286" height="292" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="336" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">2. Kalibrasi Linier Dua Titik</text>
  <line x1="354" y1="256" x2="582" y2="256" stroke="#62706a" stroke-width="1.3"/>
  <line x1="354" y1="120" x2="354" y2="256" stroke="#62706a" stroke-width="1.3"/>
  <!-- Ideal line -->
  <line x1="354" y1="256" x2="574" y2="132" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="4 3"/>
  <!-- Measured uncalibrated line -->
  <line x1="354" y1="242" x2="574" y2="152" stroke="#b45309" stroke-width="2.2"/>
  <circle cx="384" cy="230" r="4.5" fill="#b45309"/>
  <circle cx="546" cy="164" r="4.5" fill="#b45309"/>
  <text x="384" y="218" font-family="monospace" font-size="10" fill="#92400e">(Raw_L, Ref_L)</text>
  <text x="485" y="150" font-family="monospace" font-size="10" fill="#92400e">(Raw_H, Ref_H)</text>
  <text x="468" y="272" text-anchor="middle" font-family="monospace" font-size="10" fill="#4f6059">Pembacaan Mentah (Raw)</text>
  <text x="336" y="300" font-family="monospace" font-size="10.5" fill="#176e59">m = (Ref_H - Ref_L) / (Raw_H - Raw_L)</text>
  <text x="336" y="318" font-family="monospace" font-size="10.5" fill="#176e59">T_cal = m * (Raw - Raw_L) + Ref_L</text>
  <text x="336" y="340" font-family="system-ui, sans-serif" font-size="10.5" fill="#4f6059">Garis putus: ideal; Garis oranye: sensor mentah</text>

  <!-- Panel 3: Response Time -->
  <rect x="622" y="74" width="274" height="292" rx="10" fill="#eef4ef" stroke="#176e59" stroke-width="1.6"/>
  <text x="638" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">3. Response Time (Orde-1: τ)</text>
  <line x1="654" y1="256" x2="874" y2="256" stroke="#62706a" stroke-width="1.3"/>
  <line x1="654" y1="120" x2="654" y2="256" stroke="#62706a" stroke-width="1.3"/>
  <!-- Step input -->
  <line x1="654" y1="136" x2="870" y2="136" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 3"/>
  <!-- Exponential curve -->
  <path d="M 654 256 C 676 180 725 144 870 137" fill="none" stroke="#176e59" stroke-width="2.5"/>
  <!-- 1 tau marker -->
  <line x1="704" y1="180" x2="704" y2="256" stroke="#b45309" stroke-width="1.3" stroke-dasharray="3 3"/>
  <circle cx="704" cy="180" r="4" fill="#b45309"/>
  <text x="708" y="196" font-family="monospace" font-size="10" font-weight="700" fill="#92400e">1τ = 63.2%</text>
  <text x="704" y="272" text-anchor="middle" font-family="monospace" font-size="10" fill="#4f6059">t = τ</text>
  <text x="836" y="272" text-anchor="middle" font-family="monospace" font-size="10" fill="#4f6059">t ≥ 5τ</text>

  <text x="638" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">• Tunggu ≥ 5τ (~99,3%) sebelum</text>
  <text x="638" y="316" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">  mengambil titik kalibrasi stabil.</text>
  <text x="638" y="338" font-family="system-ui, sans-serif" font-size="10.5" fill="#92400e">Self-heating ADC juga dapat menggeser nol!</text>
</svg>

