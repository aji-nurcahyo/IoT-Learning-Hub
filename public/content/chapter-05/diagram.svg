<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-label="Perbandingan eksekusi blocking delay versus non-blocking millis serta alur state machine dasar">
  <rect x="2" y="2" width="916" height="386" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">TIMING NON-BLOCKING (millis) &amp; STATE MACHINE DASAR EMBEDDED C/C++</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Menghindari freeze CPU oleh delay() dan mendemonstrasikan struktur Finite State Machine (FSM) modular</text>

  <!-- Top Section: Blocking vs Non-blocking -->
  <rect x="24" y="72" width="872" height="154" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="96" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">1. Blocking delay() vs Non-Blocking millis()</text>

  <!-- Blocking bar -->
  <text x="40" y="124" font-family="monospace" font-size="11.5" font-weight="700" fill="#991b1b">Blocking:</text>
  <rect x="140" y="108" width="90" height="26" rx="4" fill="#e7efe5" stroke="#176e59" stroke-width="1.2"/>
  <text x="185" y="125" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1d2b27">LED ON</text>
  <rect x="234" y="108" width="260" height="26" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="364" y="125" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#991b1b">delay(1000) — CPU TERBLOKIR!</text>
  <rect x="498" y="108" width="90" height="26" rx="4" fill="#e7efe5" stroke="#176e59" stroke-width="1.2"/>
  <text x="543" y="125" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1d2b27">LED OFF</text>
  <rect x="592" y="108" width="260" height="26" rx="4" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="722" y="125" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#991b1b">Tombol / Sensor TIDAK TERBACA!</text>

  <!-- Non-blocking bar -->
  <text x="40" y="176" font-family="monospace" font-size="11.5" font-weight="700" fill="#176e59">millis():</text>
  <rect x="140" y="158" width="110" height="30" rx="4" fill="#ecfdf5" stroke="#176e59" stroke-width="1.4"/>
  <text x="195" y="177" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#176e59">Cek Tombol</text>
  <rect x="256" y="158" width="110" height="30" rx="4" fill="#ecfdf5" stroke="#176e59" stroke-width="1.4"/>
  <text x="311" y="177" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#176e59">Cek Timer LED</text>
  <rect x="372" y="158" width="110" height="30" rx="4" fill="#ecfdf5" stroke="#176e59" stroke-width="1.4"/>
  <text x="427" y="177" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#176e59">Baca Sensor</text>
  <rect x="488" y="158" width="110" height="30" rx="4" fill="#ecfdf5" stroke="#176e59" stroke-width="1.4"/>
  <text x="543" y="177" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#176e59">Cek Tombol</text>
  <rect x="604" y="158" width="248" height="30" rx="4" fill="#eef4ef" stroke="#176e59" stroke-width="1.2"/>
  <text x="728" y="177" text-anchor="middle" font-family="monospace" font-size="10.5" fill="#1d2b27">loop() berulang tiap beberapa mikrodetik</text>
  <text x="140" y="210" font-family="monospace" font-size="11" fill="#176e59">Rumus rollover-safe (unsigned 32-bit): if ((uint32_t)(millis() - prevMs) &gt;= intervalMs)</text>

  <!-- Bottom Section: Basic FSM -->
  <rect x="24" y="242" width="872" height="126" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="266" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">2. Finite State Machine (FSM) Sederhana untuk Node Pemantau</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#176e59"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="52" y="286" width="180" height="58" rx="8" fill="#eef4ef" stroke="#176e59" stroke-width="1.6"/>
  <text x="142" y="310" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#1d2b27">STATE_IDLE</text>
  <text x="142" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3a4c45">Menunggu interval 1000 ms</text>

  <rect x="356" y="286" width="190" height="58" rx="8" fill="#e7efe5" stroke="#176e59" stroke-width="1.6"/>
  <text x="451" y="310" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#176e59">STATE_SAMPLE</text>
  <text x="451" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3a4c45">Ukur nilai &amp; cetak telemetry</text>

  <rect x="668" y="286" width="196" height="58" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <text x="766" y="310" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#92400e">STATE_ALERT</text>
  <text x="766" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">LED kedip cepat (200 ms)</text>

  <line x1="232" y1="305" x2="352" y2="305" stroke="#176e59" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="292" y="298" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#176e59">timer >= 1000ms</text>

  <line x1="356" y1="330" x2="236" y2="330" stroke="#176e59" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="296" y="346" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#4f6059">normal (&lt; batas)</text>

  <line x1="546" y1="315" x2="664" y2="315" stroke="#b45309" stroke-width="1.8" marker-end="url(#arr-a)"/>
  <text x="605" y="306" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#92400e">nilai &gt;= batas</text>
</svg>

