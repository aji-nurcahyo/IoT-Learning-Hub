<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .box-reg { fill: #161e2e; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .box-twin { fill: #1e1b4b; stroke: #8b5cf6; stroke-width: 2; rx: 8; }
      .box-hb { fill: #1f2937; stroke: #10b981; stroke-width: 2; rx: 8; }
      .subbox { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 6; }
      .title { font-family: 'DM Sans', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .label { font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #f1f5f9; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38bdf8; }
      .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arr); }
      .arrow-sync { stroke: #a855f7; stroke-width: 2; stroke-dasharray: 4,4; marker-end: url(#arr-purple); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" />

  <text x="40" y="45" class="title">IoT Fleet Management: Device Registry, Digital Twin &amp; Heartbeat Monitor</text>
  <text x="40" y="68" class="subtitle">Manajemen Siklus Hidup Armada, Rekonsiliasi Konfigurasi Desired vs. Reported, dan Deteksi Node Mati</text>

  <!-- Step 1: Device Registry & Enrollment -->
  <g transform="translate(40, 105)">
    <rect width="260" height="395" class="box-reg" />
    <text x="20" y="32" class="label" fill="#60a5fa">1. Device Registry Database</text>
    <text x="20" y="52" class="subtitle">Pendaftaran &amp; Identitas Fisik</text>

    <!-- Identity Fields -->
    <rect x="20" y="75" width="220" height="120" class="subbox" />
    <text x="30" y="98" class="label" font-size="12">Metadata Inventaris</text>
    <text x="30" y="118" class="mono">dev_id: node-env-01</text>
    <text x="30" y="136" class="mono">hw_model: ESP32-WROOM</text>
    <text x="30" y="154" class="mono">mac: 24:6F:28:B0:11:A4</text>
    <text x="30" y="172" class="mono">fw_version: v1.2.0</text>

    <!-- Lifecycle Status -->
    <rect x="20" y="210" width="220" height="95" class="subbox" />
    <text x="30" y="233" class="label" font-size="12">Lifecycle State</text>
    <text x="30" y="253" class="mono">• PROVISIONED (Terdaftar)</text>
    <text x="30" y="271" class="mono">• ACTIVE / OPERATIONAL</text>
    <text x="30" y="289" class="mono">• DECOMMISSIONED</text>

    <text x="20" y="360" class="mono" fill="#34d399">Auth: Pre-shared Token / Cert</text>
  </g>

  <!-- Step 2: Desired vs Reported Twin -->
  <g transform="translate(350, 105)">
    <rect width="260" height="395" class="box-twin" />
    <text x="20" y="32" class="label" fill="#c084fc">2. Digital Twin Reconciliation</text>
    <text x="20" y="52" class="subtitle">Manajemen Versi Konfigurasi</text>

    <!-- Desired State -->
    <rect x="20" y="75" width="220" height="95" class="subbox" />
    <text x="30" y="98" class="label" font-size="12" fill="#c084fc">Desired State (Operator)</text>
    <text x="30" y="118" class="mono">sample_rate: 5s</text>
    <text x="30" y="136" class="mono">alert_temp: 32.5 C</text>
    <text x="30" y="154" class="mono" fill="#fbbf24">config_version: 2</text>

    <!-- Reported State -->
    <rect x="20" y="185" width="220" height="95" class="subbox" />
    <text x="30" y="208" class="label" font-size="12" fill="#34d399">Reported State (Fisik)</text>
    <text x="30" y="228" class="mono">sample_rate: 10s</text>
    <text x="30" y="246" class="mono">alert_temp: 30.0 C</text>
    <text x="30" y="264" class="mono" fill="#f87171">config_version: 1 (DRIFT!)</text>

    <!-- Sync Action -->
    <rect x="20" y="295" width="220" height="75" class="subbox" />
    <text x="30" y="318" class="label" font-size="12">Rekonsiliasi Delta</text>
    <text x="30" y="338" class="mono">Kirim Delta -> Node Update</text>
    <text x="30" y="356" class="mono" fill="#34d399">Node ACK -> Drift Selesai</text>
  </g>

  <!-- Step 3: Heartbeat & Dead Node Detection -->
  <g transform="translate(660, 105)">
    <rect width="260" height="395" class="box-hb" />
    <text x="20" y="32" class="label" fill="#34d399">3. Heartbeat &amp; Availability</text>
    <text x="20" y="52" class="subtitle">Deteksi Simpul Mati Otomatis</text>

    <!-- Heartbeat Thresholds -->
    <rect x="20" y="75" width="220" height="110" class="subbox" />
    <text x="30" y="98" class="label" font-size="12">Ambang Waktu Deteksi</text>
    <text x="30" y="118" class="mono">Heartbeat Interval: 10s</text>
    <text x="30" y="136" class="mono" fill="#fbbf24">Degraded Threshold: 15s</text>
    <text x="30" y="156" class="mono" fill="#f87171">Offline Timeout:    30s</text>
    <text x="30" y="174" class="mono" fill="#94a3b8">Timer: Monotonic clock</text>

    <!-- Dynamic Fleet State -->
    <rect x="20" y="200" width="220" height="95" class="subbox" />
    <text x="30" y="223" class="label" font-size="12">Status Ketersediaan</text>
    <text x="30" y="243" class="mono" fill="#34d399">• ONLINE (Ping normal)</text>
    <text x="30" y="261" class="mono" fill="#fbbf24">• DEGRADED (Paket hilang)</text>
    <text x="30" y="279" class="mono" fill="#f87171">• OFFLINE (Node mati)</text>

    <text x="20" y="360" class="mono" fill="#fca5a5">Decommission: Hak dicabut</text>
  </g>

  <!-- Connectors -->
  <line x1="300" y1="210" x2="350" y2="210" class="arrow" />
  <line x1="610" y1="210" x2="660" y2="210" class="arrow" />
</svg>
