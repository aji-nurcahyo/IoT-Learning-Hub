<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-label="Perbandingan arsitektur Microcontroller versus Microprocessor SBC serta peta peringatan pin ESP32-DevKitC V4">
  <rect x="2" y="2" width="916" height="386" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">ARSITEKTUR MCU VS SBC &amp; CATATAN PIN ESP32-DEVKITC V4 (WROOM-32)</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Peringatan: ESP32, ESP32-S3, dan ESP32-C3 memiliki arsitektur CPU, jumlah GPIO, dan pin terlarang yang berbeda!</text>

  <!-- Left: MCU vs MPU/SBC -->
  <rect x="24" y="76" width="420" height="288" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="100" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#1d2b27">1. Microcontroller (MCU) vs Microprocessor (MPU)</text>

  <rect x="40" y="116" width="388" height="108" rx="8" fill="#eef4ef" stroke="#176e59" stroke-width="1.3"/>
  <text x="54" y="138" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#176e59">Microcontroller (contoh: ESP32-WROOM-32)</text>
  <text x="54" y="158" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">• CPU + SRAM (~520 KiB) + Flash (~4 MiB) + Peripherals</text>
  <text x="54" y="175" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">  (GPIO, ADC, PWM, UART, I2C, SPI, Wi-Fi/BLE) dalam 1 SoC.</text>
  <text x="54" y="192" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">• Tanpa OS penuh (bare-metal / FreeRTOS), boot &lt; 1 detik.</text>
  <text x="54" y="209" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">• Daya rendah (miliwatt–mikrowatt saat deep sleep).</text>

  <rect x="40" y="236" width="388" height="112" rx="8" fill="#f9fafb" stroke="#62706a" stroke-width="1.3"/>
  <text x="54" y="258" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#1d2b27">Microprocessor / SBC (contoh: Raspberry Pi 4)</text>
  <text x="54" y="278" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">• CPU inti bertenaga; RAM (GB) &amp; Storage (microSD/eMMC)</text>
  <text x="54" y="295" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">  berada di luar chip SoC (eksternal).</text>
  <text x="54" y="312" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">• Menjalankan Linux OS, cocok untuk Edge Gateway &amp; DB.</text>
  <text x="54" y="329" font-family="system-ui, sans-serif" font-size="11.5" fill="#92400e">• Daya tinggi (watt), boot puluhan detik, butuh shutdown aman.</text>

  <!-- Right: ESP32-DevKitC V4 Pin Safety -->
  <rect x="462" y="76" width="434" height="288" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <text x="478" y="100" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#92400e">2. Klasifikasi Pin ESP32-DevKitC V4 (WROOM-32)</text>

  <rect x="478" y="116" width="402" height="72" rx="6" fill="#ecfdf5" stroke="#176e59" stroke-width="1.2"/>
  <text x="492" y="136" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#176e59">GPIO Aman Umum (Input &amp; Output 3,3 V)</text>
  <text x="492" y="154" font-family="monospace" font-size="11" fill="#1d2b27">GPIO 4, 13, 14, 16, 17, 18, 19, 21, 22, 23, 25, 26, 27, 32, 33</text>
  <text x="492" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#3a4c45">Catatan: GPIO 16/17 tidak tersedia pada modul WROVER (PSRAM).</text>

  <rect x="478" y="198" width="402" height="58" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="492" y="218" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e">Input-Only &amp; Tanpa Internal Pull-Up/Down</text>
  <text x="492" y="236" font-family="monospace" font-size="11" fill="#1d2b27">GPIO 34, 35, 36 (VP), 39 (VN) — Hanya INPUT (ADC1)!</text>

  <rect x="478" y="266" width="402" height="82" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="492" y="286" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">HINDARI / HATI-HATI (Flash &amp; Strapping Pins)</text>
  <text x="492" y="304" font-family="monospace" font-size="11" fill="#7f1d1d">GPIO 6–11 : Terhubung ke SPI Flash internal (JANGAN dipakai!)</text>
  <text x="492" y="320" font-family="monospace" font-size="11" fill="#7f1d1d">GPIO 0, 2, 5, 12, 15 : Strapping pins (memengaruhi boot mode)</text>
  <text x="492" y="336" font-family="monospace" font-size="11" fill="#7f1d1d">GPIO 1 (TX0), 3 (RX0) : Jalur Serial Monitor &amp; flashing USB</text>
</svg>

