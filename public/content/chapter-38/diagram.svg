<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .box-dev { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .box-harness { fill: #1e293b; stroke: #f43f5e; stroke-width: 2; rx: 8; }
      .box-backend { fill: #1e293b; stroke: #10b981; stroke-width: 2; rx: 8; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .label { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; text-anchor: middle; }
      .label-mono { fill: #38bdf8; font-family: ui-monospace, monospace; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-fault { stroke: #f43f5e; stroke-width: 2; fill: none; marker-end: url(#arrowhead-fault); }
      .arrow-ok { stroke: #10b981; stroke-width: 2; fill: none; marker-end: url(#arrowhead-ok); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
    <marker id="arrowhead-fault" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f43f5e" />
    </marker>
    <marker id="arrowhead-ok" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Header -->
  <text x="400" y="35" class="title">Arsitektur Fault Injection Harness &amp; Retensi Buffer Offline</text>
  <text x="400" y="58" class="label">Penyuntikan Gangguan Jaringan &amp; Brownout Daya untuk Verifikasi Keandalan Sistem</text>

  <!-- Three Columns: Device Client -> Fault Injector -> Cloud Backend -->
  <g transform="translate(40, 95)">
    <!-- Device Client -->
    <rect x="0" y="0" width="210" height="170" class="box-dev" />
    <text x="105" y="25" class="title" fill="#38bdf8">Resilient Device</text>
    <text x="105" y="45" class="label">Node Klien IoT Tangguh</text>
    <rect x="15" y="60" width="180" height="30" rx="4" fill="#334155" />
    <text x="105" y="80" class="label-mono">Store-and-Forward Buffer</text>
    <rect x="15" y="98" width="180" height="30" rx="4" fill="#334155" />
    <text x="105" y="118" class="label-mono">Brownout Detector (BOD)</text>
    <rect x="15" y="136" width="180" height="26" rx="4" fill="#334155" />
    <text x="105" y="153" class="label-mono">Sequence Number ID</text>

    <!-- Fault Injection Harness -->
    <rect x="255" y="0" width="210" height="170" class="box-harness" />
    <text x="360" y="25" class="title" fill="#f43f5e">Chaos Injector</text>
    <text x="360" y="45" class="label">Penyuntikan Kegagalan</text>
    <rect x="270" y="60" width="180" height="30" rx="4" fill="#334155" />
    <text x="360" y="80" class="label-mono" fill="#f43f5e">Packet Loss Drop</text>
    <rect x="270" y="98" width="180" height="30" rx="4" fill="#334155" />
    <text x="360" y="118" class="label-mono" fill="#f43f5e">Voltage Brownout</text>
    <rect x="270" y="136" width="180" height="26" rx="4" fill="#334155" />
    <text x="360" y="153" class="label-mono" fill="#f43f5e">Latency Jitter Spikes</text>

    <!-- Cloud Backend -->
    <rect x="510" y="0" width="210" height="170" class="box-backend" />
    <text x="615" y="25" class="title" fill="#10b981">Cloud Backend</text>
    <text x="615" y="45" class="label">Penerima Telemetri Utuh</text>
    <rect x="525" y="60" width="180" height="30" rx="4" fill="#334155" />
    <text x="615" y="80" class="label-mono" fill="#10b981">Drained Buffer Ingestion</text>
    <rect x="525" y="98" width="180" height="30" rx="4" fill="#334155" />
    <text x="615" y="118" class="label-mono" fill="#10b981">Zero Message Loss</text>
    <rect x="525" y="136" width="180" height="26" rx="4" fill="#334155" />
    <text x="615" y="153" class="label-mono" fill="#10b981">In-Order Verifier</text>
  </g>

  <!-- Connecting Arrows -->
  <path d="M 250 175 L 295 175" class="arrow-fault" />
  <path d="M 505 175 L 550 175" class="arrow-ok" />

  <!-- Reliability Metrics Summary Panel -->
  <g transform="translate(40, 290)">
    <rect x="0" y="0" width="720" height="160" class="box" />
    <text x="360" y="25" class="title">Evaluasi Kuantitatif Keandalan Sistem (Simulasi 1 Tahun Operasi)</text>

    <!-- MTBF Card -->
    <g transform="translate(40, 45)">
      <rect x="0" y="0" width="190" height="95" rx="6" fill="#334155" stroke="#38bdf8" />
      <text x="95" y="25" class="title" fill="#38bdf8" font-size="14">MTBF</text>
      <text x="95" y="55" class="title" fill="#f8fafc" font-size="20">2187.0 Jam</text>
      <text x="95" y="80" class="label" font-size="11">Rata-rata Waktu Bebas Gagal</text>
    </g>

    <!-- MTTR Card -->
    <g transform="translate(265, 45)">
      <rect x="0" y="0" width="190" height="95" rx="6" fill="#334155" stroke="#f59e0b" />
      <text x="95" y="25" class="title" fill="#f59e0b" font-size="14">MTTR</text>
      <text x="95" y="55" class="title" fill="#f8fafc" font-size="20">3.0 Jam</text>
      <text x="95" y="80" class="label" font-size="11">Waktu Pemulihan Insiden</text>
    </g>

    <!-- Availability Card -->
    <g transform="translate(490, 45)">
      <rect x="0" y="0" width="190" height="95" rx="6" fill="#334155" stroke="#10b981" />
      <text x="95" y="25" class="title" fill="#10b981" font-size="14">Availability</text>
      <text x="95" y="55" class="title" fill="#10b981" font-size="20">99.863 %</text>
      <text x="95" y="80" class="label" font-size="11">Standar SLA Industri Lulus</text>
    </g>
  </g>
</svg>
