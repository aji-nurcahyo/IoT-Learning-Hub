<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-label="Diagram alur data end-to-end sistem Internet of Things dari dunia fisik hingga aplikasi dan aktuasi balik">
  <rect x="2" y="2" width="916" height="356" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">ALUR DATA END-TO-END SISTEM INTERNET OF THINGS (CONCEPTUAL FLOW)</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Menunjukkan batas antara dunia fisik, embedded node, gateway/jaringan, platform, dan aplikasi (bukan skema wiring)</text>

  <!-- Physical World -->
  <rect x="24" y="84" width="150" height="106" rx="10" fill="#eef4ef" stroke="#176e59" stroke-width="1.8"/>
  <text x="99" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">1. Physical World</text>
  <text x="99" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">Suhu, kelembaban,</text>
  <text x="99" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">intensitas cahaya,</text>
  <text x="99" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">tekanan, gerak</text>
  <text x="99" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#176e59">[Sensor]</text>

  <!-- Embedded Node -->
  <rect x="206" y="84" width="166" height="106" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.8"/>
  <text x="289" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">2. Embedded Node</text>
  <text x="289" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">Microcontroller (MCU)</text>
  <text x="289" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">Sampling, ADC, filter,</text>
  <text x="289" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">enkapsulasi payload</text>
  <text x="289" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#176e59">[Firmware + Radio]</text>

  <!-- Gateway & Network -->
  <rect x="404" y="84" width="156" height="106" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.8"/>
  <text x="482" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">3. Gateway / Net</text>
  <text x="482" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">Wi-Fi, LoRa, BLE, 4G</text>
  <text x="482" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">Translasi protokol,</text>
  <text x="482" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">buffering, keamanan</text>
  <text x="482" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#176e59">[MQTT / HTTP / IP]</text>

  <!-- Platform / Edge-Cloud -->
  <rect x="592" y="84" width="148" height="106" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.8"/>
  <text x="666" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">4. Edge / Cloud</text>
  <text x="666" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">Broker pesan,</text>
  <text x="666" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">validasi skema,</text>
  <text x="666" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">Time-Series DB</text>
  <text x="666" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#176e59">[Ingest &amp; Store]</text>

  <!-- Application -->
  <rect x="772" y="84" width="124" height="106" rx="10" fill="#e7efe5" stroke="#176e59" stroke-width="2"/>
  <text x="834" y="108" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">5. Application</text>
  <text x="834" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">Dashboard,</text>
  <text x="834" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">alerting,</text>
  <text x="834" y="162" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">analitik / kontrol</text>
  <text x="834" y="180" text-anchor="middle" font-family="monospace" font-size="10" fill="#176e59">[Decision]</text>

  <!-- Forward arrows -->
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#176e59"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b45309"/>
    </marker>
  </defs>
  <line x1="174" y1="137" x2="202" y2="137" stroke="#176e59" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <line x1="372" y1="137" x2="400" y2="137" stroke="#176e59" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <line x1="560" y1="137" x2="588" y2="137" stroke="#176e59" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <line x1="740" y1="137" x2="768" y2="137" stroke="#176e59" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- Feedback / Command Loop -->
  <path d="M 834 190 L 834 268 L 289 268 L 289 194" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
  <rect x="415" y="252" width="286" height="28" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="558" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#92400e">Command / Control Loop (Downlink: Setpoint / Relay)</text>

  <!-- Actuator Box -->
  <rect x="24" y="226" width="150" height="72" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <text x="99" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">Actuator</text>
  <text x="99" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">Pompa, katup, kipas,</text>
  <text x="99" y="283" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#78350f">alarm (aksi fisik)</text>
  <path d="M 289 190 L 289 262 L 178 262" fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Footer note -->
  <text x="24" y="334" font-family="system-ui, sans-serif" font-size="11" fill="#4f6059">Catatan: Data telemetry bergerak dari kiri ke kanan (uplink); perintah kendali bergerak balik menuju Actuator (downlink).</text>
</svg>

