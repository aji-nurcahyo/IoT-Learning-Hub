<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .box-layer { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 6; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .label { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; text-anchor: middle; }
      .label-mono { fill: #38bdf8; font-family: ui-monospace, monospace; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Header -->
  <text x="400" y="35" class="title">Arsitektur Capstone Level 4: Intelligent, Secure &amp; Resilient Platform</text>
  <text x="400" y="58" class="label">Sintesis Terpadu 6 Pilar Rekayasa: Low-Power, FreeRTOS, Modbus, TinyML, Twin, &amp; Resilience</text>

  <!-- Grid of 6 Subsystems (SATC 01-06) -->
  <g transform="translate(40, 85)">
    <!-- SATC-01: Low Power -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="155" class="box" stroke="#10b981" />
      <text x="110" y="25" class="title" fill="#10b981" font-size="13">SATC-01: Low Power</text>
      <text x="110" y="45" class="label" font-size="11">Deep Sleep &amp; Gating</text>
      <rect x="15" y="60" width="190" height="28" rx="4" fill="#334155" />
      <text x="105" y="78" class="label-mono" font-size="11">I_avg: 0.176 mA</text>
      <rect x="15" y="95" width="190" height="28" rx="4" fill="#334155" />
      <text x="105" y="113" class="label-mono" font-size="11">Masa Hidup: &gt; 1.3 Tahun</text>
      <text x="110" y="142" class="label" fill="#10b981" font-size="11">&#x2714; PASS (Duty Cycle 1/600)</text>
    </g>

    <!-- SATC-02: FreeRTOS Preemption -->
    <g transform="translate(250, 0)">
      <rect x="0" y="0" width="220" height="155" class="box" stroke="#38bdf8" />
      <text x="110" y="25" class="title" fill="#38bdf8" font-size="13">SATC-02: FreeRTOS SMP</text>
      <text x="110" y="45" class="label" font-size="11">Preemption &amp; Queues</text>
      <rect x="15" y="60" width="190" height="28" rx="4" fill="#334155" />
      <text x="105" y="78" class="label-mono" font-size="11">SafetyWatchdog (Pri 3)</text>
      <rect x="15" y="95" width="190" height="28" rx="4" fill="#334155" />
      <text x="105" y="113" class="label-mono" font-size="11">Preempts on Tick 2</text>
      <text x="110" y="142" class="label" fill="#38bdf8" font-size="11">&#x2714; PASS (Zero Timing Inversion)</text>
    </g>

    <!-- SATC-03: Industrial Modbus -->
    <g transform="translate(500, 0)">
      <rect x="0" y="0" width="220" height="155" class="box" stroke="#f59e0b" />
      <text x="110" y="25" class="title" fill="#f59e0b" font-size="13">SATC-03: Modbus RTU</text>
      <text x="110" y="45" class="label" font-size="11">RS-485 &amp; CRC-16</text>
      <rect x="15" y="60" width="190" height="28" rx="4" fill="#334155" />
      <text x="105" y="78" class="label-mono" font-size="11">Polinom: 0xA001</text>
      <rect x="15" y="95" width="190" height="28" rx="4" fill="#334155" />
      <text x="105" y="113" class="label-mono" font-size="11">Holding Reg: 25.5 C</text>
      <text x="110" y="142" class="label" fill="#f59e0b" font-size="11">&#x2714; PASS (Checksum Valid)</text>
    </g>

    <!-- SATC-04: Edge AI TinyML -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="220" height="155" class="box" stroke="#a855f7" />
      <text x="110" y="25" class="title" fill="#a855f7" font-size="13">SATC-04: Edge AI TinyML</text>
      <text x="110" y="45" class="label" font-size="11">Kuantisasi INT8 Dense</text>
      <rect x="15" y="60" width="190" height="28" rx="4" fill="#334155" />
      <text x="105" y="78" class="label-mono" font-size="11">RMS &amp; P2P Extraction</text>
      <rect x="15" y="95" width="190" height="28" rx="4" fill="#334155" />
      <text x="105" y="113" class="label-mono" font-size="11">BEARING_FAULT Detected</text>
      <text x="110" y="142" class="label" fill="#a855f7" font-size="11">&#x2714; PASS (Latensi &lt; 50 &mu;s)</text>
    </g>

    <!-- SATC-05: Digital Twin -->
    <g transform="translate(250, 180)">
      <rect x="0" y="0" width="220" height="155" class="box" stroke="#f43f5e" />
      <text x="110" y="25" class="title" fill="#f43f5e" font-size="13">SATC-05: Digital Twin</text>
      <text x="110" y="45" class="label" font-size="11">Termal Orde-1 &amp; What-If</text>
      <rect x="15" y="60" width="190" height="28" rx="4" fill="#334155" />
      <text x="105" y="78" class="label-mono" font-size="11">Live Sync: 27.9 C</text>
      <rect x="15" y="95" width="190" height="28" rx="4" fill="#334155" />
      <text x="105" y="113" class="label-mono" font-size="11">What-If (250W) &#x2192; 47.1 C</text>
      <text x="110" y="142" class="label" fill="#f43f5e" font-size="11">&#x2714; PASS (Prediktif Aman)</text>
    </g>

    <!-- SATC-06: Resilience & Governance -->
    <g transform="translate(500, 180)">
      <rect x="0" y="0" width="220" height="155" class="box" stroke="#10b981" />
      <text x="110" y="25" class="title" fill="#10b981" font-size="13">SATC-06: Resilience &amp; Gov</text>
      <text x="110" y="45" class="label" font-size="11">Fault Inject &amp; Privacy</text>
      <rect x="15" y="60" width="190" height="28" rx="4" fill="#334155" />
      <text x="105" y="78" class="label-mono" font-size="11">Store &amp; Forward Drained</text>
      <rect x="15" y="95" width="190" height="28" rx="4" fill="#334155" />
      <text x="105" y="113" class="label-mono" font-size="11">PII Removed (UU PDP)</text>
      <text x="110" y="142" class="label" fill="#10b981" font-size="11">&#x2714; PASS (Avail &gt; 99.9%)</text>
    </g>
  </g>

  <!-- Bottom Banner: Acceptance Success -->
  <g transform="translate(40, 440)">
    <rect x="0" y="0" width="720" height="30" rx="4" fill="#1e293b" stroke="#10b981" />
    <text x="360" y="20" class="label-mono" fill="#10b981">STATUS CAPSTONE: 6 DARI 6 KASUS UJI PENERIMAAN SISTEM TERVERIFIKASI 100%</text>
  </g>
</svg>
