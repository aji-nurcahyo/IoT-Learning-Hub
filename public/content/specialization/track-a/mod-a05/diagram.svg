  <line x1="260" y1="125" x2="310" y2="150" stroke="#38bdf8" stroke-width="2"/>
  <line x1="260" y1="250" x2="310" y2="210" stroke="#ec4899" stroke-width="2"/>
  <line x1="570" y1="180" x2="620" y2="180" stroke="#10b981" stroke-width="3"/>
