<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .box-state { fill: #161e2e; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .box-active { fill: #3b1820; stroke: #ef4444; stroke-width: 2; rx: 8; }
      .box-pend { fill: #312015; stroke: #f59e0b; stroke-width: 2; rx: 8; }
      .box-res { fill: #122822; stroke: #10b981; stroke-width: 2; rx: 8; }
      .subbox { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 6; }
      .title { font-family: 'DM Sans', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .label { font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #f1f5f9; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38bdf8; }
      .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arr); }
      .arrow-red { stroke: #ef4444; stroke-width: 2; marker-end: url(#arr-red); }
      .arrow-green { stroke: #10b981; stroke-width: 2; marker-end: url(#arr-green); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" />

  <text x="40" y="45" class="title">Alert Lifecycle State Machine &amp; Dashboard Visualization Engine</text>
  <text x="40" y="68" class="subtitle">Siklus Hidup Peringatan IoT: Normal, Pending (T_for), Firing, Hysteresis, dan Throttling Notifikasi</text>

  <!-- State 1: NORMAL -->
  <g transform="translate(40, 110)">
    <rect width="190" height="150" class="box-state" />
    <text x="20" y="32" class="label" fill="#60a5fa">1. NORMAL</text>
    <text x="20" y="52" class="subtitle">Kondisi Aman</text>
    <rect x="20" y="65" width="150" height="65" class="subbox" />
    <text x="30" y="88" class="mono">val &lt; 30.0 C</text>
    <text x="30" y="106" class="mono" fill="#94a3b8">Zero notifications</text>
    <text x="30" y="122" class="mono" fill="#34d399">Dashboard: Green</text>
  </g>

  <!-- State 2: PENDING -->
  <g transform="translate(280, 110)">
    <rect width="190" height="150" class="box-pend" />
    <text x="20" y="32" class="label" fill="#fbbf24">2. PENDING</text>
    <text x="20" y="52" class="subtitle">Evaluasi Durasi (T_for)</text>
    <rect x="20" y="65" width="150" height="65" class="subbox" />
    <text x="30" y="88" class="mono">val &gt;= 30.0 C</text>
    <text x="30" y="106" class="mono" fill="#fbbf24">Hold: 5 Detik</text>
    <text x="30" y="122" class="mono" fill="#94a3b8">Redam Transient</text>
  </g>

  <!-- State 3: FIRING -->
  <g transform="translate(520, 110)">
    <rect width="190" height="150" class="box-active" />
    <text x="20" y="32" class="label" fill="#f87171">3. FIRING</text>
    <text x="20" y="52" class="subtitle">Insiden Aktif</text>
    <rect x="20" y="65" width="150" height="65" class="subbox" />
    <text x="30" y="88" class="mono" fill="#fca5a5">Kirim Notifikasi</text>
    <text x="30" y="106" class="mono" fill="#cbd5e1">Throttle: 15s</text>
    <text x="30" y="122" class="mono" fill="#f87171">Dashboard: RED</text>
  </g>

  <!-- State 4: RESOLVED -->
  <g transform="translate(740, 110)">
    <rect width="180" height="150" class="box-res" />
    <text x="20" y="32" class="label" fill="#34d399">4. RESOLVED</text>
    <text x="20" y="52" class="subtitle">Kondisi Pulih</text>
    <rect x="20" y="65" width="140" height="65" class="subbox" />
    <text x="30" y="88" class="mono">val &lt; 29.0 C</text>
    <text x="30" y="106" class="mono" fill="#34d399">Hysteresis: 1.0 C</text>
    <text x="30" y="122" class="mono" fill="#a7f3d0">Notif Pemulihan</text>
  </g>

  <!-- Transition Wires -->
  <line x1="230" y1="180" x2="280" y2="180" class="arrow" />
  <line x1="470" y1="180" x2="520" y2="180" class="arrow-red" />
  <line x1="710" y1="180" x2="740" y2="180" class="arrow-green" />

  <!-- Lower Dashboard Layout Area -->
  <g transform="translate(40, 290)">
    <rect width="880" height="215" class="subbox" fill="#0b1329" stroke="#1e293b" />
    <text x="20" y="30" class="label" fill="#93c5fd">Grafana Panel Hierarchy &amp; Anti-Fatigue Rules</text>

    <!-- Panel 1: Fleet Health -->
    <rect x="20" y="45" width="200" height="150" class="subbox" />
    <text x="30" y="70" class="label" font-size="12">Stat: Fleet Health</text>
    <text x="30" y="100" class="mono" font-size="22" fill="#34d399">98.4 %</text>
    <text x="30" y="125" class="mono" fill="#94a3b8">Active: 196 / 200 Node</text>
    <text x="30" y="145" class="mono" fill="#38bdf8">MTBF: 720 Jam</text>
    <text x="30" y="165" class="mono" fill="#cbd5e1">PDR: 99.8 %</text>

    <!-- Panel 2: Gauge -->
    <rect x="240" y="45" width="200" height="150" class="subbox" />
    <text x="250" y="70" class="label" font-size="12">Gauge: Temperature</text>
    <text x="250" y="100" class="mono" font-size="22" fill="#f59e0b">28.4 °C</text>
    <text x="250" y="125" class="mono" fill="#94a3b8">Threshold High: 30.0 C</text>
    <text x="250" y="145" class="mono" fill="#fbbf24">Warning Band: 28 - 30 C</text>
    <text x="250" y="165" class="mono" fill="#f87171">Critical: &gt; 32 C</text>

    <!-- Panel 3: Anti-Fatigue Features -->
    <rect x="460" y="45" width="400" height="150" class="subbox" />
    <text x="475" y="70" class="label" font-size="12" fill="#c084fc">Anti-Alert Fatigue Mechanisms</text>
    <text x="475" y="95" class="mono">• Pending Hold (T_for = 5s): Meredam lonjakan transient sesaat</text>
    <text x="475" y="120" class="mono">• Hysteresis Band (1.0 C): Mencegah alert flapping on/off berulang</text>
    <text x="475" y="145" class="mono">• Rate Throttling (15s): Membatasi interval pengiriman pengingat</text>
    <text x="475" y="170" class="mono">• Severity Stratification: P1 (Panggilan/SMS), P2 (Email/Slack), P3 (Log)</text>
  </g>
</svg>
