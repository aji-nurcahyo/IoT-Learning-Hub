<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .box-raw { fill: #161e2e; stroke: #3b82f6; stroke-width: 2; rx: 8; }
      .box-down { fill: #1f1b2e; stroke: #a855f7; stroke-width: 2; rx: 8; }
      .box-purge { fill: #1f2937; stroke: #ef4444; stroke-width: 2; rx: 8; }
      .box-query { fill: #142823; stroke: #10b981; stroke-width: 2; rx: 8; }
      .subbox { fill: #0f172a; stroke: #334155; stroke-width: 1.5; rx: 6; }
      .title { font-family: 'DM Sans', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .label { font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; font-weight: 600; fill: #f1f5f9; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38bdf8; }
      .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arr); }
      .arrow-red { stroke: #ef4444; stroke-width: 2; stroke-dasharray: 4,4; marker-end: url(#arr-red); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" />

  <text x="40" y="45" class="title">Time-Series Lifecycle: Ingestion, Downsampling, Retention &amp; Queries</text>
  <text x="40" y="68" class="subtitle">Arsitektur Penyimpanan Deret Waktu IoT: Pemisahan Data Resolusi Tinggi dan Rollup Multi-Tingkat</text>

  <!-- Step 1: Raw Data Ingestion -->
  <g transform="translate(40, 105)">
    <rect width="260" height="395" class="box-raw" />
    <text x="20" y="32" class="label" fill="#60a5fa">1. Raw Telemetry Table</text>
    <text x="20" y="52" class="subtitle">Resolusi Tinggi (1 - 5 Detik)</text>

    <!-- Schema -->
    <rect x="20" y="75" width="220" height="110" class="subbox" />
    <text x="30" y="98" class="label" font-size="12">telemetry_raw</text>
    <text x="30" y="118" class="mono">device_id: TEXT (Tag)</text>
    <text x="30" y="136" class="mono">timestamp: INT (UTC)</text>
    <text x="30" y="156" class="mono">temp_c, hum_pct: REAL</text>
    <text x="30" y="174" class="mono" fill="#94a3b8">B-Tree Index: (dev, ts)</text>

    <!-- Characteristics -->
    <rect x="20" y="200" width="220" height="95" class="subbox" />
    <text x="30" y="223" class="label" font-size="12">Sifat Operasi</text>
    <text x="30" y="243" class="mono">• Append-Only Writes</text>
    <text x="30" y="261" class="mono">• Zero Random Updates</text>
    <text x="30" y="279" class="mono">• Retensi Pendek: 7 Hari</text>

    <text x="20" y="360" class="mono" fill="#f87171">Kapasitas: ~460 MB / minggu</text>
  </g>

  <!-- Step 2: Downsampling & Rollups -->
  <g transform="translate(350, 105)">
    <rect width="260" height="395" class="box-down" />
    <text x="20" y="32" class="label" fill="#c084fc">2. Continuous Rollup Engine</text>
    <text x="20" y="52" class="subtitle">Agregasi Waktu Berkala</text>

    <!-- Rollup 1m -->
    <rect x="20" y="75" width="220" height="110" class="subbox" />
    <text x="30" y="98" class="label" font-size="12">telemetry_rollup_1m</text>
    <text x="30" y="118" class="mono">window_start: (ts/60)*60</text>
    <text x="30" y="136" class="mono">sample_count: COUNT(*)</text>
    <text x="30" y="156" class="mono">avg_temp, min_temp, max</text>
    <text x="30" y="174" class="mono" fill="#94a3b8">PK: (dev, window_start)</text>

    <!-- Rollup 1h -->
    <rect x="20" y="200" width="220" height="95" class="subbox" />
    <text x="30" y="223" class="label" font-size="12">Rollup 1-Jam &amp; 1-Hari</text>
    <text x="30" y="243" class="mono">• Resolusi Tren Jangka Panjang</text>
    <text x="30" y="261" class="mono">• Retensi Panjang: 1 - 5 Tahun</text>
    <text x="30" y="279" class="mono">• Ukuran Ramping: Kompresi 98%</text>

    <text x="20" y="360" class="mono" fill="#34d399">Integritas Historis Terjaga</text>
  </g>

  <!-- Step 3: Retention & Queries -->
  <g transform="translate(660, 105)">
    <rect width="260" height="395" class="box-purge" />
    <text x="20" y="32" class="label" fill="#f87171">3. Aging &amp; Fast Analytics</text>
    <text x="20" y="52" class="subtitle">Purging Otomatis &amp; Kueri Cepat</text>

    <!-- Retention Purge -->
    <rect x="20" y="75" width="220" height="100" class="subbox" />
    <text x="30" y="98" class="label" font-size="12" fill="#fca5a5">Retention Purge Daemon</text>
    <text x="30" y="118" class="mono">DELETE WHERE ts &lt; cutoff</text>
    <text x="30" y="136" class="mono">Bebaskan Disk SD Card</text>
    <text x="30" y="156" class="mono" fill="#94a3b8">Jadwal: Cron / Harian</text>

    <!-- Fast Query -->
    <rect x="20" y="190" width="220" height="105" class="subbox" />
    <text x="30" y="213" class="label" font-size="12" fill="#86efac">Dashboard Query Performance</text>
    <text x="30" y="233" class="mono">Grafana 24h: baca 1m rollup</text>
    <text x="30" y="251" class="mono">Grafana 1y:  baca 1h rollup</text>
    <text x="30" y="269" class="mono" fill="#34d399">Query Latency: &lt; 15 ms</text>

    <text x="20" y="360" class="mono" fill="#fbbf24">Zero System Degradation</text>
  </g>

  <!-- Connectors -->
  <line x1="300" y1="210" x2="350" y2="210" class="arrow" />
  <line x1="610" y1="210" x2="660" y2="210" class="arrow" />
</svg>
