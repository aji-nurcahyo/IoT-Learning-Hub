<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-label="Model TCP/IP 4 lapis untuk IoT, perbandingan TCP versus UDP, dan alur DHCP/DNS/Gateway">
  <rect x="2" y="2" width="916" height="386" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">FONDASI JARINGAN IoT: TCP/IP STACK, TCP VS UDP &amp; RESOLUSI ALAMAT</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Memahami enkapsulasi paket, peran DHCP/DNS/Gateway, serta trade-off keandalan versus overhead</text>

  <!-- Panel 1: TCP/IP 4 Layers -->
  <rect x="24" y="74" width="276" height="292" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">1. TCP/IP Stack &amp; Enkapsulasi</text>

  <rect x="40" y="114" width="244" height="50" rx="6" fill="#e7efe5" stroke="#176e59" stroke-width="1.3"/>
  <text x="52" y="134" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1d2b27">4. Application Layer</text>
  <text x="52" y="152" font-family="monospace" font-size="10.5" fill="#176e59">HTTP, MQTT, CoAP, DNS, NTP</text>

  <rect x="40" y="174" width="244" height="50" rx="6" fill="#eef4ef" stroke="#176e59" stroke-width="1.3"/>
  <text x="52" y="194" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1d2b27">3. Transport Layer (Ports)</text>
  <text x="52" y="212" font-family="monospace" font-size="10.5" fill="#176e59">TCP (20 B hdr) | UDP (8 B hdr)</text>

  <rect x="40" y="234" width="244" height="50" rx="6" fill="#ffffff" stroke="#176e59" stroke-width="1.3"/>
  <text x="52" y="254" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1d2b27">2. Internet Layer (Routing)</text>
  <text x="52" y="272" font-family="monospace" font-size="10.5" fill="#176e59">IPv4 (20 B hdr) / IPv6 / ICMP</text>

  <rect x="40" y="294" width="244" height="54" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.3"/>
  <text x="52" y="314" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">1. Link / Physical Layer</text>
  <text x="52" y="332" font-family="monospace" font-size="10.5" fill="#78350f">Wi-Fi (802.11), Ethernet, PPP</text>

  <!-- Panel 2: TCP vs UDP -->
  <rect x="316" y="74" width="290" height="292" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="332" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">2. TCP (Andal) vs UDP (Ringan)</text>

  <rect x="332" y="114" width="258" height="114" rx="7" fill="#eef4ef" stroke="#176e59" stroke-width="1.3"/>
  <text x="344" y="134" font-family="monospace" font-size="11" font-weight="700" fill="#176e59">TCP (Connection-Oriented)</text>
  <text x="344" y="152" font-family="monospace" font-size="10" fill="#1d2b27">Node --- SYN ---&gt; Server</text>
  <text x="344" y="167" font-family="monospace" font-size="10" fill="#1d2b27">Node &lt;-- SYN-ACK- Server (3-way)</text>
  <text x="344" y="182" font-family="monospace" font-size="10" fill="#1d2b27">Node --- ACK ---&gt; Server</text>
  <text x="344" y="202" font-family="system-ui, sans-serif" font-size="10.5" fill="#3a4c45">+ Urut, ACK, retransmisi (MQTT/HTTP)</text>
  <text x="344" y="218" font-family="system-ui, sans-serif" font-size="10.5" fill="#92400e">- Overhead &amp; latensi handshake lebih besar</text>

  <rect x="332" y="238" width="258" height="110" rx="7" fill="#fff7ed" stroke="#b45309" stroke-width="1.3"/>
  <text x="344" y="258" font-family="monospace" font-size="11" font-weight="700" fill="#92400e">UDP (Connectionless)</text>
  <text x="344" y="276" font-family="monospace" font-size="10" fill="#1d2b27">Node === Datagram ==&gt; Server</text>
  <text x="344" y="298" font-family="system-ui, sans-serif" font-size="10.5" fill="#3a4c45">+ Header hanya 8 B, tanpa handshake</text>
  <text x="344" y="314" font-family="system-ui, sans-serif" font-size="10.5" fill="#3a4c45">+ Cocok: DNS, NTP, CoAP, DHCP</text>
  <text x="344" y="330" font-family="system-ui, sans-serif" font-size="10.5" fill="#991b1b">- Tidak menjamin paket tiba/urut</text>

  <!-- Panel 3: DHCP / DNS / Socket -->
  <rect x="622" y="74" width="274" height="292" rx="10" fill="#eef4ef" stroke="#176e59" stroke-width="1.6"/>
  <text x="638" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">3. Alur Konektivitas Node</text>
  <text x="638" y="124" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#176e59">Langkah 1 — DHCP (UDP 67/68)</text>
  <text x="638" y="142" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">Minta IP, Subnet Mask, Gateway,</text>
  <text x="638" y="157" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">dan alamat DNS Server.</text>

  <text x="638" y="186" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#176e59">Langkah 2 — DNS (UDP 53)</text>
  <text x="638" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">Terjemahkan hostname broker</text>
  <text x="638" y="219" font-family="monospace" font-size="10.5" fill="#3a4c45">broker.local -&gt; 192.168.10.50</text>

  <text x="638" y="248" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">Langkah 3 — Socket (IP:Port)</text>
  <text x="638" y="266" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">Buka koneksi ke endpoint spesifik,</text>
  <text x="638" y="281" font-family="monospace" font-size="10.5" fill="#92400e">192.168.10.50:1883 (MQTT)</text>

  <rect x="638" y="300" width="242" height="50" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="650" y="320" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">Goodput = Payload / Total Wire Bits</text>
  <text x="650" y="336" font-family="system-ui, sans-serif" font-size="10.5" fill="#4f6059">Bandwidth != Throughput Aktual!</text>
</svg>

