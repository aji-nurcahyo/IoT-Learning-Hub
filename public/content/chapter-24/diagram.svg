<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .flow-box { fill: #161e2e; stroke: #2563eb; stroke-width: 2; rx: 8; }
      .node-mqtt { fill: #881337; stroke: #f43f5e; stroke-width: 1.5; rx: 5; }
      .node-func { fill: #78350f; stroke: #f59e0b; stroke-width: 1.5; rx: 5; }
      .node-switch { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 1.5; rx: 5; }
      .node-http { fill: #064e3b; stroke: #10b981; stroke-width: 1.5; rx: 5; }
      .node-catch { fill: #4c1d95; stroke: #8b5cf6; stroke-width: 1.5; rx: 5; }
      .title { font-family: 'DM Sans', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .label { font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #f1f5f9; }
      .mono { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #38bdf8; }
      .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arr); }
      .arrow-red { stroke: #f43f5e; stroke-width: 2; marker-end: url(#arr-red); }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
  </defs>

  <rect width="960" height="540" class="bg" />

  <text x="40" y="45" class="title">Node-RED Event-Driven Pipeline: MQTT, Context Store, HTTP &amp; Catch</text>
  <text x="40" y="68" class="subtitle">Arsitektur Aliran Data Visual untuk Integrasi Telemetri, Peringatan Dini, dan REST API</text>

  <!-- Flow Canvas Background -->
  <g transform="translate(40, 100)">
    <rect width="880" height="400" class="flow-box" />

    <!-- Lane 1: Ingestion & Routing -->
    <!-- MQTT In -->
    <rect x="40" y="50" width="160" height="60" class="node-mqtt" />
    <text x="50" y="75" class="label">mqtt in</text>
    <text x="50" y="95" class="mono" fill="#cbd5e1">iot/lab/+/telemetry</text>

    <!-- Context Store (Change node) -->
    <rect x="250" y="30" width="160" height="45" class="node-func" />
    <text x="260" y="50" class="label">change (global)</text>
    <text x="260" y="65" class="mono" font-size="9" fill="#cbd5e1">set global.latest</text>

    <!-- Switch Node -->
    <rect x="250" y="95" width="160" height="60" class="node-switch" />
    <text x="260" y="120" class="label">switch</text>
    <text x="260" y="140" class="mono" fill="#cbd5e1">temp_c &gt;= 30.0 ?</text>

    <!-- Output 1: Alarm Enricher (Function) -->
    <rect x="470" y="80" width="170" height="55" class="node-func" />
    <text x="480" y="103" class="label">function</text>
    <text x="480" y="122" class="mono" fill="#cbd5e1">Format Alarm Event</text>

    <!-- Output 1 Wire: MQTT Out Alarm -->
    <rect x="680" y="80" width="160" height="55" class="node-mqtt" />
    <text x="690" y="103" class="label">mqtt out</text>
    <text x="690" y="122" class="mono" fill="#cbd5e1">.../event/alarm</text>

    <!-- Output 2: Normal Log (Debug) -->
    <rect x="470" y="150" width="170" height="40" fill="#1e293b" stroke="#64748b" rx="4" />
    <text x="480" y="175" class="label" fill="#94a3b8">debug (Normal)</text>

    <!-- Lane 2: HTTP Endpoint -->
    <!-- HTTP In -->
    <rect x="40" y="210" width="180" height="55" class="node-http" />
    <text x="50" y="233" class="label">http in</text>
    <text x="50" y="252" class="mono" fill="#cbd5e1">GET /api/v1/telemetry</text>

    <!-- Function: Read Context -->
    <rect x="270" y="210" width="180" height="55" class="node-func" />
    <text x="280" y="233" class="label">function</text>
    <text x="280" y="252" class="mono" fill="#cbd5e1">global.get('latest')</text>

    <!-- HTTP Response -->
    <rect x="500" y="210" width="160" height="55" class="node-http" />
    <text x="510" y="233" class="label">http response</text>
    <text x="510" y="252" class="mono" fill="#cbd5e1">Status 200 OK</text>

    <!-- Lane 3: Catch & Dead Letter -->
    <!-- Catch Node -->
    <rect x="40" y="305" width="180" height="50" class="node-catch" />
    <text x="50" y="328" class="label">catch (Exceptions)</text>
    <text x="50" y="344" class="mono" fill="#cbd5e1">Scope: All Nodes</text>

    <!-- Dead Letter Debug -->
    <rect x="270" y="305" width="180" height="50" fill="#3f1d24" stroke="#e11d48" rx="4" />
    <text x="280" y="328" class="label" fill="#fda4af">debug (Dead-Letter)</text>
    <text x="280" y="344" class="mono" fill="#cbd5e1">msg.error log</text>

    <!-- Wires / Connections -->
    <line x1="200" y1="80" x2="250" y2="52" class="arrow" />
    <line x1="200" y1="80" x2="250" y2="125" class="arrow" />
    <line x1="410" y1="110" x2="470" y2="105" class="arrow-red" />
    <line x1="410" y1="140" x2="470" y2="170" class="arrow" />
    <line x1="640" y1="107" x2="680" y2="107" class="arrow-red" />
    <line x1="220" y1="237" x2="270" y2="237" class="arrow" />
    <line x1="450" y1="237" x2="500" y2="237" class="arrow" />
    <line x1="220" y1="330" x2="270" y2="330" class="arrow" />
  </g>
</svg>
