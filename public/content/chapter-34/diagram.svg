<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .box-otbr { fill: #1e293b; stroke: #10b981; stroke-width: 2; rx: 8; }
      .box-leader { fill: #1e293b; stroke: #f43f5e; stroke-width: 2; rx: 8; }
      .box-router { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .box-end { fill: #1e293b; stroke: #94a3b8; stroke-width: 2; rx: 8; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .label { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; text-anchor: middle; }
      .label-mono { fill: #38bdf8; font-family: ui-monospace, monospace; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .mesh-link { stroke: #64748b; stroke-width: 2; stroke-dasharray: 4 4; }
      .route-path { stroke: #10b981; stroke-width: 3; fill: none; marker-end: url(#arrowhead-route); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
    <marker id="arrowhead-route" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Header -->
  <text x="400" y="35" class="title">Topologi Thread Mesh &amp; Arsitektur Commissioning Matter</text>
  <text x="400" y="58" class="label">Pondasi Interoperabilitas Cerdas Berbasis Native IPv6 &amp; IEEE 802.15.4</text>

  <!-- Mesh Topology Graph Area -->
  <g transform="translate(40, 90)">
    <!-- Boundary Label -->
    <rect x="0" y="0" width="440" height="350" fill="#1e293b" opacity="0.3" rx="10" stroke="#334155" />
    <text x="220" y="25" class="title" fill="#38bdf8">Thread Wireless Mesh (2.4 GHz 802.15.4)</text>

    <!-- Mesh Connecting Lines -->
    <line x1="80" y1="280" x2="160" y2="180" class="mesh-link" />
    <line x1="160" y1="180" x2="260" y2="100" class="mesh-link" />
    <line x1="260" y1="100" x2="360" y2="180" class="mesh-link" />
    <line x1="360" y1="180" x2="360" y2="280" class="mesh-link" />
    <line x1="160" y1="180" x2="360" y2="180" class="mesh-link" />

    <!-- Active Route Highlight (DoorLock -> LightSensor) -->
    <path d="M 80 270 L 155 185" class="route-path" />
    <path d="M 160 170 L 255 105" class="route-path" />
    <path d="M 265 105 L 355 175" class="route-path" />
    <path d="M 360 190 L 360 270" class="route-path" />

    <!-- Node 1: DoorLock (End Device) -->
    <circle cx="80" cy="280" r="32" class="box-end" />
    <text x="80" y="280" class="label-mono" fill="#f8fafc">DoorLock</text>
    <text x="80" y="295" class="label" fill="#94a3b8" font-size="10">End Device</text>

    <!-- Node 2: Router 1 -->
    <circle cx="160" cy="180" r="34" class="box-router" />
    <text x="160" y="180" class="label-mono" fill="#f8fafc">Router 1</text>
    <text x="160" y="195" class="label" fill="#38bdf8" font-size="10">Routing</text>

    <!-- Node 3: Leader -->
    <circle cx="260" cy="100" r="36" class="box-leader" />
    <text x="260" y="100" class="label-mono" fill="#f8fafc">Leader</text>
    <text x="260" y="115" class="label" fill="#f43f5e" font-size="10">RLOC16 Coord</text>

    <!-- Node 4: Border Router (OTBR) -->
    <circle cx="360" cy="180" r="36" class="box-otbr" />
    <text x="360" y="180" class="label-mono" fill="#f8fafc">BorderRouter</text>
    <text x="360" y="195" class="label" fill="#10b981" font-size="10">OTBR Bridge</text>

    <!-- Node 5: LightSensor (End Device) -->
    <circle cx="360" cy="280" r="32" class="box-end" />
    <text x="360" y="280" class="label-mono" fill="#f8fafc">LightSensor</text>
    <text x="360" y="295" class="label" fill="#94a3b8" font-size="10">Sleepy Device</text>
  </g>

  <!-- Matter Commissioning & Security Flow -->
  <g transform="translate(510, 90)">
    <rect x="0" y="0" width="250" height="350" class="box" />
    <text x="125" y="25" class="title">Matter Security Stack</text>

    <!-- Step 1: PASE -->
    <rect x="15" y="50" width="220" height="70" rx="6" fill="#334155" stroke="#f59e0b" />
    <text x="125" y="72" class="title" fill="#f59e0b" font-size="14">1. PASE (SPAKE2+)</text>
    <text x="125" y="90" class="label" font-size="11">Setup PIN Code &amp; QR Scan</text>
    <text x="125" y="108" class="label-mono" font-size="11">Saluran Aman Tanpa Kunci</text>

    <!-- Step 2: NOC Issuance -->
    <rect x="15" y="135" width="220" height="70" rx="6" fill="#334155" stroke="#38bdf8" />
    <text x="125" y="157" class="title" fill="#38bdf8" font-size="14">2. Fabric Kredensial</text>
    <text x="125" y="175" class="label" font-size="11">Node Operational Cert (X.509)</text>
    <text x="125" y="193" class="label-mono" font-size="11">Fabric ID Terdaftar</text>

    <!-- Step 3: CASE -->
    <rect x="15" y="220" width="220" height="70" rx="6" fill="#334155" stroke="#10b981" />
    <text x="125" y="242" class="title" fill="#10b981" font-size="14">3. CASE Operasional</text>
    <text x="125" y="260" class="label" font-size="11">Mutual Auth via NOC</text>
    <text x="125" y="278" class="label-mono" font-size="11">Multi-Admin / Multi-Fabric</text>

    <text x="125" y="325" class="label" fill="#10b981">Terkonfirmasi CASE Ready</text>
  </g>
</svg>
