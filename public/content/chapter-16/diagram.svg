<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Perbandingan antarmuka komunikasi serial UART asinkron, I2C open-drain dengan pull-up, dan SPI 4-kawat sinkron">
  <rect x="2" y="2" width="916" height="396" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">ANTARMUKA SERIAL PERANGKAT: UART, I2C &amp; SPI PADA ESP32-DEVKITC V4</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Membedakan protokol asinkron point-to-point (UART) vs bus sinkron ber-alamat (I2C) vs kecepatan tinggi (SPI)</text>

  <!-- Panel 1: UART -->
  <rect x="24" y="74" width="280" height="302" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">1. UART (Asinkron, 2 Kabel)</text>
  <rect x="40" y="114" width="248" height="74" rx="6" fill="#eef4ef" stroke="#176e59" stroke-width="1.2"/>
  <text x="52" y="134" font-family="monospace" font-size="11" font-weight="700" fill="#176e59">Koneksi Crossover + GND</text>
  <text x="52" y="154" font-family="monospace" font-size="10.5" fill="#1d2b27">ESP32 TX2 (17) ---&gt; RX Sensor</text>
  <text x="52" y="170" font-family="monospace" font-size="10.5" fill="#1d2b27">ESP32 RX2 (16) &lt;--- TX Sensor</text>

  <text x="40" y="210" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#1d2b27">Frame 8N1 (10 bit / byte):</text>
  <rect x="40" y="220" width="36" height="28" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="58" y="238" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#92400e">Start</text>
  <rect x="76" y="220" width="160" height="28" fill="#e7efe5" stroke="#176e59" stroke-width="1.2"/>
  <text x="156" y="238" text-anchor="middle" font-family="monospace" font-size="10" fill="#176e59">8 Data Bits (LSB-&gt;MSB)</text>
  <rect x="236" y="220" width="42" height="28" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
  <text x="257" y="238" text-anchor="middle" font-family="monospace" font-size="9.5" fill="#92400e">Stop</text>

  <text x="40" y="276" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">• Tanpa kabel clock: kedua sisi</text>
  <text x="40" y="293" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">  wajib sepakat Baud Rate (115200).</text>
  <text x="40" y="311" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">• Hanya 1-ke-1 (contoh: GPS, GSM).</text>
  <text x="40" y="330" font-family="system-ui, sans-serif" font-size="10.5" fill="#991b1b">• Efisiensi 8N1 = 8/10 = 80%.</text>

  <!-- Panel 2: I2C -->
  <rect x="320" y="74" width="280" height="302" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.6"/>
  <text x="336" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">2. I2C (Sinkron, Open-Drain)</text>
  <rect x="336" y="114" width="248" height="102" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1.2"/>
  <text x="348" y="134" font-family="monospace" font-size="11" font-weight="700" fill="#92400e">SDA (GPIO 21) &amp; SCL (GPIO 22)</text>
  <text x="348" y="154" font-family="monospace" font-size="10.5" fill="#176e59">+3.3V --[4.7kΩ]--+-- SDA Bus</text>
  <text x="348" y="170" font-family="monospace" font-size="10.5" fill="#176e59">+3.3V --[4.7kΩ]--+-- SCL Bus</text>
  <text x="348" y="192" font-family="system-ui, sans-serif" font-size="10.5" fill="#1d2b27">Banyak slave berbagi 2 kabel via</text>
  <text x="348" y="207" font-family="monospace" font-size="10.5" fill="#92400e">alamat 7-bit (mis. 0x76 BME280)</text>

  <text x="336" y="242" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">• Frame: START -&gt; Addr(7b)+R/W -&gt;</text>
  <text x="336" y="259" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">  ACK -&gt; Data Byte -&gt; ACK -&gt; STOP.</text>
  <text x="336" y="280" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">• Wajib resistor pull-up ke 3,3 V!</text>
  <text x="336" y="298" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">• Kecepatan umum: 100 kHz / 400 kHz.</text>
  <text x="336" y="316" font-family="system-ui, sans-serif" font-size="11" fill="#991b1b">• Jarak kabel pendek (&lt; 0,5–1 m)</text>
  <text x="336" y="333" font-family="system-ui, sans-serif" font-size="11" fill="#991b1b">  karena kapasitansi jalur.</text>

  <!-- Panel 3: SPI -->
  <rect x="616" y="74" width="280" height="302" rx="10" fill="#eef4ef" stroke="#176e59" stroke-width="1.6"/>
  <text x="632" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">3. SPI (Sinkron, Full-Duplex)</text>
  <rect x="632" y="114" width="248" height="106" rx="6" fill="#ffffff" stroke="#176e59" stroke-width="1.2"/>
  <text x="644" y="134" font-family="monospace" font-size="11" font-weight="700" fill="#176e59">ESP32 VSPI Default Pins:</text>
  <text x="644" y="153" font-family="monospace" font-size="10.5" fill="#1d2b27">MOSI (GPIO 23) : Master -&gt; Slave</text>
  <text x="644" y="169" font-family="monospace" font-size="10.5" fill="#1d2b27">MISO (GPIO 19) : Slave  -&gt; Master</text>
  <text x="644" y="185" font-family="monospace" font-size="10.5" fill="#1d2b27">SCLK (GPIO 18) : Clock Sinkron</text>
  <text x="644" y="201" font-family="monospace" font-size="10.5" fill="#b45309">CS   (GPIO 05) : 1 pin / slave!</text>

  <text x="632" y="246" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">• Push-pull driver: sangat cepat</text>
  <text x="632" y="263" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">  (1 MHz s.d. puluhan MHz).</text>
  <text x="632" y="284" font-family="system-ui, sans-serif" font-size="11" fill="#176e59">• Cocok: SD Card, Layar TFT, LoRa.</text>
  <text x="632" y="304" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">• 4 Mode SPI (CPOL, CPHA):</text>
  <text x="632" y="321" font-family="monospace" font-size="10" fill="#4f6059">  Mode 0..3 harus cocok datasheet!</text>
  <text x="632" y="340" font-family="system-ui, sans-serif" font-size="10.5" fill="#991b1b">• Boros pin CS jika banyak slave.</text>
</svg>

