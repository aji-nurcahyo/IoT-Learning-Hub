<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { fill: #1e293b; stroke: #38bdf8; stroke-width: 2; rx: 8; }
      .box-dev { fill: #1e293b; stroke: #94a3b8; stroke-width: 2; rx: 6; }
      .box-lb { fill: #1e293b; stroke: #f59e0b; stroke-width: 2; rx: 8; }
      .box-part { fill: #1e293b; stroke: #10b981; stroke-width: 2; rx: 6; }
      .box-worker { fill: #1e293b; stroke: #a855f7; stroke-width: 2; rx: 6; }
      .title { fill: #f8fafc; font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; }
      .label { fill: #cbd5e1; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; text-anchor: middle; }
      .label-mono { fill: #38bdf8; font-family: ui-monospace, monospace; font-size: 12px; text-anchor: middle; }
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-lb { stroke: #f59e0b; stroke-width: 2; fill: none; marker-end: url(#arrowhead-lb); }
      .arrow-drop { stroke: #f43f5e; stroke-width: 2; stroke-dasharray: 4 4; fill: none; marker-end: url(#arrowhead-drop); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
    <marker id="arrowhead-lb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
    </marker>
    <marker id="arrowhead-drop" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f43f5e" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Header -->
  <text x="400" y="35" class="title">Arsitektur Kluster Terdistribusi, Sharding &amp; Backpressure</text>
  <text x="400" y="58" class="label">Partisi Antrean Berbasis Device Hash &amp; Skalabilitas Horisontal Konsumen</text>

  <!-- IoT Devices (Left) -->
  <g transform="translate(40, 95)">
    <rect x="0" y="0" width="160" height="200" class="box-dev" />
    <text x="80" y="25" class="title" fill="#cbd5e1" font-size="14">Armada IoT Edge</text>
    <text x="80" y="45" class="label" font-size="11">Jutaan Node Aktif</text>

    <rect x="15" y="60" width="130" height="28" rx="4" fill="#334155" />
    <text x="80" y="78" class="label-mono">dev-edge-001</text>
    <rect x="15" y="95" width="130" height="28" rx="4" fill="#334155" />
    <text x="80" y="113" class="label-mono">dev-edge-002</text>
    <rect x="15" y="130" width="130" height="28" rx="4" fill="#334155" />
    <text x="80" y="148" class="label-mono">dev-edge-003</text>
    <rect x="15" y="165" width="130" height="24" rx="4" fill="#334155" />
    <text x="80" y="181" class="label-mono">... dev-edge-N</text>
  </g>

  <!-- Load Balancer / Sharder (Middle-Left) -->
  <g transform="translate(240, 120)">
    <rect x="0" y="0" width="160" height="150" class="box-lb" />
    <text x="80" y="25" class="title" fill="#f59e0b" font-size="14">Ingestion Sharder</text>
    <text x="80" y="45" class="label" font-size="11">Consistent Hashing</text>
    
    <rect x="15" y="60" width="130" height="40" rx="4" fill="#334155" />
    <text x="80" y="78" class="label-mono" font-size="11">Hash(DevID) % 4</text>
    <text x="80" y="93" class="label" fill="#10b981" font-size="10">In-Order Routing</text>

    <rect x="15" y="110" width="130" height="28" rx="4" fill="#334155" />
    <text x="80" y="128" class="label-mono" fill="#f59e0b">HAProxy L4 TCP</text>
  </g>

  <!-- Connecting Arrows: Dev -> LB -->
  <path d="M 200 195 L 240 195" class="arrow" />

  <!-- Partition Queues (Middle-Right) -->
  <g transform="translate(440, 95)">
    <!-- Partition 0 -->
    <rect x="0" y="0" width="150" height="42" class="box-part" />
    <text x="75" y="25" class="label-mono">Partisi 0 (25 msg)</text>

    <!-- Partition 1 -->
    <rect x="0" y="52" width="150" height="42" class="box-part" />
    <text x="75" y="77" class="label-mono">Partisi 1 (24 msg)</text>

    <!-- Partition 2 -->
    <rect x="0" y="104" width="150" height="42" class="box-part" />
    <text x="75" y="129" class="label-mono">Partisi 2 (23 msg)</text>

    <!-- Partition 3 -->
    <rect x="0" y="156" width="150" height="42" class="box-part" />
    <text x="75" y="181" class="label-mono">Partisi 3 (28 msg)</text>
  </g>

  <!-- Connecting Arrows: LB -> Partitions -->
  <path d="M 400 145 L 440 115" class="arrow-lb" />
  <path d="M 400 170 L 440 167" class="arrow-lb" />
  <path d="M 400 195 L 440 219" class="arrow-lb" />
  <path d="M 400 220 L 440 271" class="arrow-lb" />

  <!-- Worker Consumers (Right) -->
  <g transform="translate(630, 95)">
    <rect x="0" y="0" width="130" height="42" class="box-worker" />
    <text x="65" y="25" class="label-mono" fill="#a855f7">Worker 0</text>

    <rect x="0" y="52" width="130" height="42" class="box-worker" />
    <text x="65" y="77" class="label-mono" fill="#a855f7">Worker 1</text>

    <rect x="0" y="104" width="130" height="42" class="box-worker" />
    <text x="65" y="129" class="label-mono" fill="#a855f7">Worker 2</text>

    <rect x="0" y="156" width="130" height="42" class="box-worker" />
    <text x="65" y="181" class="label-mono" fill="#a855f7">Worker 3</text>
  </g>

  <!-- Connecting Arrows: Partitions -> Workers -->
  <path d="M 590 115 L 630 115" class="arrow" />
  <path d="M 590 167 L 630 167" class="arrow" />
  <path d="M 590 219 L 630 219" class="arrow" />
  <path d="M 590 271 L 630 271" class="arrow" />

  <!-- Backpressure Mitigation Flow (Bottom Panel) -->
  <g transform="translate(40, 320)">
    <rect x="0" y="0" width="720" height="130" class="box" />
    <text x="360" y="25" class="title">Mekanisme Proteksi Tekanan Balik (Backpressure Threshold)</text>

    <g transform="translate(30, 45)">
      <rect x="0" y="0" width="280" height="60" rx="6" fill="#334155" stroke="#f43f5e" />
      <text x="140" y="22" class="title" fill="#f43f5e" font-size="13">Batas Antrean Penuh (&gt; 50 Pesan)</text>
      <text x="140" y="45" class="label-mono" fill="#cbd5e1">Tindakan: Drop / Pushback Signal</text>

      <path d="M 280 30 L 340 30" class="arrow-drop" />
      <text x="310" y="22" class="label-mono" fill="#f43f5e">Overflow</text>

      <rect x="340" y="0" width="310" height="60" rx="6" fill="#334155" stroke="#10b981" />
      <text x="495" y="22" class="title" fill="#10b981" font-size="13">Hasil Proteksi Sistem</text>
      <text x="495" y="45" class="label" fill="#cbd5e1" font-size="11">Memory Heap Terlindungi | Zero OOM Crash</text>
    </g>
  </g>
</svg>
