<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-label="Fenomena switch bounce mekanik, jendela waktu software debouncing 50 ms, dan rangkaian tombol INPUT_PULLUP active-low">
  <rect x="2" y="2" width="916" height="386" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">GPIO DIGITAL INPUT, SWITCH BOUNCE &amp; SOFTWARE DEBOUNCING</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Membedakan sinyal mekanik mentah yang memantul dari pembacaan stabil hasil filter debounce 50 ms</text>

  <!-- Left: Bounce Waveform -->
  <rect x="24" y="74" width="540" height="292" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">1. Gelombang Sinyal Tombol (Active-Low INPUT_PULLUP)</text>

  <!-- Raw signal plot -->
  <text x="40" y="124" font-family="monospace" font-size="11" fill="#991b1b">Sinyal Mentah (Raw GPIO):</text>
  <text x="40" y="144" font-family="monospace" font-size="10" fill="#4f6059">HIGH (3.3V)</text>
  <text x="40" y="196" font-family="monospace" font-size="10" fill="#4f6059">LOW  (0.0V)</text>
  <polyline points="118,140 190,140 195,192 203,140 212,192 220,140 228,192 238,192 380,192 385,140 392,192 400,140 530,140"
            fill="none" stroke="#b91c1c" stroke-width="2.2"/>
  <!-- Highlight bounce zone -->
  <rect x="188" y="130" width="54" height="72" fill="#fef2f2" opacity="0.55" stroke="#b91c1c" stroke-dasharray="3 3"/>
  <text x="215" y="216" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">Bounce (~15 ms)</text>
  <text x="215" y="229" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#991b1b">Tanpa debounce: terbaca 3x tekan!</text>

  <!-- Debounced signal plot -->
  <text x="40" y="258" font-family="monospace" font-size="11" fill="#176e59">Setelah Debounce (T_db = 50 ms) &amp; Falling-Edge:</text>
  <polyline points="118,274 282,274 282,316 445,316 445,274 530,274"
            fill="none" stroke="#176e59" stroke-width="2.5"/>
  <circle cx="282" cy="295" r="5" fill="#b45309"/>
  <text x="282" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">1x Event Tekan Valid (t + 50 ms)</text>

  <!-- Right: Wiring & Logic Table -->
  <rect x="582" y="74" width="314" height="292" rx="10" fill="#eef4ef" stroke="#176e59" stroke-width="1.6"/>
  <text x="598" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">2. Wiring &amp; Logika Pin (ESP32)</text>

  <rect x="598" y="114" width="282" height="114" rx="8" fill="#ffffff" stroke="#176e59" stroke-width="1.2"/>
  <text x="612" y="136" font-family="monospace" font-size="11" font-weight="700" fill="#176e59">Input: GPIO 27 (INPUT_PULLUP)</text>
  <text x="612" y="156" font-family="monospace" font-size="10.5" fill="#1d2b27">GPIO 27 ----o  o---- GND</text>
  <text x="612" y="172" font-family="monospace" font-size="10.5" fill="#4f6059">             Button</text>
  <text x="612" y="194" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">• Dilepas = HIGH (1)</text>
  <text x="612" y="211" font-family="system-ui, sans-serif" font-size="11" fill="#92400e">• Ditekan = LOW  (0) [Active-Low]</text>

  <rect x="598" y="240" width="282" height="110" rx="8" fill="#ffffff" stroke="#176e59" stroke-width="1.2"/>
  <text x="612" y="262" font-family="monospace" font-size="11" font-weight="700" fill="#176e59">Output: GPIO 25 (LED Status)</text>
  <text x="612" y="282" font-family="monospace" font-size="10.5" fill="#1d2b27">GPIO 25 --[220 Ω]--&gt;|-- GND</text>
  <text x="612" y="304" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">FSM 3-Mode tiap 1x tekan valid:</text>
  <text x="612" y="322" font-family="monospace" font-size="10.5" fill="#92400e">OFF -&gt; ON -&gt; BLINK (250ms) -&gt; OFF</text>
</svg>

