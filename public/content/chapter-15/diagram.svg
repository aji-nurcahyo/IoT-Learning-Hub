<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Perbandingan aliran paket MQTT QoS 0, QoS 1, QoS 2 serta mekanisme Retained Message dan Last Will">
  <rect x="2" y="2" width="916" height="396" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">MQTT QoS 0/1/2, RETAINED MESSAGES, SESSIONS &amp; LAST WILL (LWT)</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Memahami jaminan pengiriman per-hop (Client-Broker), deduplikasi QoS 1, serta deteksi offline via LWT</text>

  <!-- Panel 1: QoS 0, 1, 2 -->
  <rect x="24" y="74" width="446" height="302" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">1. Jaminan Pengiriman QoS (Per-Hop)</text>

  <rect x="40" y="114" width="414" height="68" rx="6" fill="#eef4ef" stroke="#176e59" stroke-width="1.2"/>
  <text x="52" y="133" font-family="monospace" font-size="11" font-weight="700" fill="#176e59">QoS 0 — At Most Once (Fire &amp; Forget)</text>
  <text x="52" y="152" font-family="monospace" font-size="10.5" fill="#1d2b27">Sender  ---- PUBLISH ----&gt;  Receiver   (1 paket, tanpa ACK)</text>
  <text x="52" y="170" font-family="system-ui, sans-serif" font-size="10.5" fill="#4f6059">Paling ringan; cocok untuk telemetry berkala yang tak masalah sesekali hilang.</text>

  <rect x="40" y="192" width="414" height="78" rx="6" fill="#e7efe5" stroke="#176e59" stroke-width="1.3"/>
  <text x="52" y="211" font-family="monospace" font-size="11" font-weight="700" fill="#176e59">QoS 1 — At Least Once (Pesan Pasti Sampai, Bisa Duplikat)</text>
  <text x="52" y="230" font-family="monospace" font-size="10.5" fill="#1d2b27">Sender  ---- PUBLISH (PacketId) ----&gt;  Receiver</text>
  <text x="52" y="246" font-family="monospace" font-size="10.5" fill="#1d2b27">Sender  &lt;--- PUBACK  (PacketId) -----  Receiver  (2 paket)</text>
  <text x="52" y="262" font-family="system-ui, sans-serif" font-size="10.5" fill="#92400e">Jika PUBACK hilang, Sender kirim ulang (DUP=1) -&gt; butuh deduplikasi!</text>

  <rect x="40" y="280" width="414" height="82" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="1.3"/>
  <text x="52" y="299" font-family="monospace" font-size="11" font-weight="700" fill="#92400e">QoS 2 — Exactly Once (4-Step Handshake)</text>
  <text x="52" y="317" font-family="monospace" font-size="10" fill="#1d2b27">Sender --PUBLISH--&gt; &lt;--PUBREC-- --PUBREL--&gt; &lt;--PUBCOMP-- Receiver</text>
  <text x="52" y="336" font-family="system-ui, sans-serif" font-size="10.5" fill="#78350f">Nol duplikat, tetapi butuh 4 paket &amp; state dua arah (latensi &amp; memori tinggi).</text>
  <text x="52" y="352" font-family="system-ui, sans-serif" font-size="10" fill="#991b1b">Catatan: PubSubClient Arduino hanya mendukung publish QoS 0.</text>

  <!-- Panel 2: Retained & LWT -->
  <rect x="486" y="74" width="410" height="302" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="502" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">2. Retained Message, Keepalive &amp; Last Will (LWT)</text>

  <rect x="502" y="114" width="378" height="88" rx="7" fill="#eef4ef" stroke="#176e59" stroke-width="1.2"/>
  <text x="514" y="134" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#176e59">Retained Message (retain=true)</text>
  <text x="514" y="152" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">Broker menyimpan 1 pesan terakhir per topic.</text>
  <text x="514" y="168" font-family="system-ui, sans-serif" font-size="11" fill="#1d2b27">Subscriber baru langsung menerima status terakhir</text>
  <text x="514" y="184" font-family="monospace" font-size="10" fill="#4f6059">(Hapus retained: publish payload kosong "" + retain=true)</text>

  <rect x="502" y="212" width="378" height="150" rx="7" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
  <text x="514" y="232" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">Last Will &amp; Testament (LWT) + Keepalive</text>
  <text x="514" y="252" font-family="monospace" font-size="10.5" fill="#1d2b27">1. CONNECT: bawa LWT ("offline", retain=true)</text>
  <text x="514" y="269" font-family="monospace" font-size="10.5" fill="#176e59">2. CONNECTED: publish "online" (retain=true)</text>
  <text x="514" y="286" font-family="monospace" font-size="10.5" fill="#1d2b27">3. Keepalive: PINGREQ / PINGRESP tiap 30–60 s</text>
  <text x="514" y="305" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">4. Jika mati mendadak (tanpa DISCONNECT):</text>
  <text x="514" y="322" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d">   Setelah 1,5x keepalive, Broker mem-publish LWT</text>
  <text x="514" y="338" font-family="monospace" font-size="10.5" fill="#991b1b">   "offline" ke seluruh Subscriber topic status!</text>
</svg>

