<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Perbandingan arsitektur IoT lima lapis dan batas tanggung jawab Edge versus Cloud">
  <rect x="2" y="2" width="916" height="396" rx="14" fill="#f8faf7" stroke="#c8d4cc" stroke-width="2"/>
  <text x="24" y="34" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#176e59">ARSITEKTUR IoT LIMA LAPIS &amp; BATAS EDGE VS CLOUD</text>
  <text x="24" y="54" font-family="system-ui, sans-serif" font-size="12" fill="#4f6059">Studi kasus referensi: Sistem Monitoring Suhu Terdistribusi (Cold-Chain / Ruang Server)</text>

  <!-- 5-Layer Stack (Left/Center) -->
  <rect x="24" y="76" width="540" height="52" rx="8" fill="#e7efe5" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="98" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">5. Application &amp; Business Layer</text>
  <text x="40" y="116" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">Dashboard NOC, manajemen alarm SLA, laporan audit kepatuhan suhu</text>

  <rect x="24" y="138" width="540" height="52" rx="8" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="160" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">4. Platform / Processing Layer</text>
  <text x="40" y="178" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">Message broker, validasi skema, Time-Series DB, rule engine lintas lokasi</text>

  <rect x="24" y="200" width="540" height="52" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <text x="40" y="222" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">3. Edge / Middleware Layer (System Boundary Kritis)</text>
  <text x="40" y="240" font-family="system-ui, sans-serif" font-size="11.5" fill="#78350f">Gateway lokal, agregasi jendela waktu, store-and-forward buffer, alarm lokal</text>

  <rect x="24" y="262" width="540" height="52" rx="8" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="284" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">2. Network / Transport Layer</text>
  <text x="40" y="302" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">Sub-GHz / BLE / Wi-Fi lokal menuju Gateway; Ethernet / 4G LTE ke Cloud</text>

  <rect x="24" y="324" width="540" height="52" rx="8" fill="#eef4ef" stroke="#176e59" stroke-width="1.6"/>
  <text x="40" y="346" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1d2b27">1. Device / Perception Layer</text>
  <text x="40" y="364" font-family="system-ui, sans-serif" font-size="11.5" fill="#3a4c45">Node sensor suhu terkalibrasi, MCU hemat daya, buzzer / relay fail-safe</text>

  <!-- Right Panel: Trade-off Boundary -->
  <rect x="588" y="76" width="308" height="144" rx="10" fill="#ffffff" stroke="#176e59" stroke-width="1.6"/>
  <text x="606" y="100" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#176e59">CLOUD PROCESSING</text>
  <text x="606" y="122" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">+ Korelasi historis multi-gedung</text>
  <text x="606" y="140" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">+ Kapasitas penyimpanan jangka panjang</text>
  <text x="606" y="162" font-family="system-ui, sans-serif" font-size="11.5" fill="#92400e">- Latensi bergantung WAN (100 ms–beberapa s)</text>
  <text x="606" y="180" font-family="system-ui, sans-serif" font-size="11.5" fill="#92400e">- Rentan saat backhaul terputus</text>
  <text x="606" y="204" font-family="monospace" font-size="10.5" fill="#4f6059">Cocok untuk: Analitik, arsip, dashboard</text>

  <rect x="588" y="232" width="308" height="144" rx="10" fill="#fff7ed" stroke="#b45309" stroke-width="1.8"/>
  <text x="606" y="256" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">EDGE / LOCAL PROCESSING</text>
  <text x="606" y="278" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">+ Latensi deterministik (&lt; 50 ms)</text>
  <text x="606" y="296" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">+ Tetap aman saat internet mati</text>
  <text x="606" y="314" font-family="system-ui, sans-serif" font-size="11.5" fill="#1d2b27">+ Menghemat bandwidth uplink via agregasi</text>
  <text x="606" y="336" font-family="system-ui, sans-serif" font-size="11.5" fill="#78350f">- Memori &amp; CPU gateway terbatas</text>
  <text x="606" y="360" font-family="monospace" font-size="10.5" fill="#92400e">Cocok untuk: Safety alarm, filter, buffer</text>
</svg>

